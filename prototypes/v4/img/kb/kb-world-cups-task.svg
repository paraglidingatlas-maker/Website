<svg class="dk dk-cq-task" viewBox="0 0 1200 340" role="img" aria-labelledby="dk-cq-task-t dk-cq-task-d" xmlns="http://www.w3.org/2000/svg"><title id="dk-cq-task-t">How a race task is scored</title><desc id="dk-cq-task-d">How a race task is scored. A course from launch through the start cylinder (SSS), turnpoints, the end of speed section (ESS) and goal, with the three games marked: distance along the whole course, launch to goal; time and leading only between the start of speed and its end: how fast, and how far in front.</desc><defs><radialGradient id="dk-cq-task-glow"><stop offset="0" stop-color="#ff7517" stop-opacity=".16"/><stop offset=".45" stop-color="#ff7517" stop-opacity=".05"/><stop offset="1" stop-color="#ff7517" stop-opacity="0"/></radialGradient></defs><circle cx="600" cy="130" r="300" fill="url(#dk-cq-task-glow)"/><circle class="fa" cx="260" cy="140" r="75" style="fill-opacity:.07"/><path class="d" d="M185,140 a75,75 0 1,0 150,0 a75,75 0 1,0 -150,0"/><path class="d" d="M455,80 a45,45 0 1,0 90,0 a45,45 0 1,0 -90,0"/><path class="d" d="M695,155 a45,45 0 1,0 90,0 a45,45 0 1,0 -90,0"/><circle class="fa" cx="950" cy="115" r="55" style="fill-opacity:.07"/><path class="d" d="M895,115 a55,55 0 1,0 110,0 a55,55 0 1,0 -110,0"/><path class="o" d="M100,140 L335,140 L500,125 L710,120 L895,115 L1080,115"/><circle class="fw" cx="100" cy="140" r="3.5"/><text x="100" y="117" class="sub" text-anchor="middle">launch</text><circle class="fa" cx="260" cy="140" r="3.5"/><text x="260" y="57" class="lab" text-anchor="middle">SSS</text><circle class="fw" cx="500" cy="80" r="3.5"/><text x="500" y="27" class="sub" text-anchor="middle">TP1</text><circle class="fw" cx="740" cy="155" r="3.5"/><text x="740" y="102" class="sub" text-anchor="middle">TP2</text><circle class="fa" cx="950" cy="115" r="3.5"/><text x="950" y="52" class="lab" text-anchor="middle">ESS</text><circle class="fa" cx="1080" cy="115" r="3.5"/><text x="1080" y="92" class="lab" text-anchor="middle">goal</text><path class="o" d="M1080,99 L1080,131"/><rect class="fw" x="100" y="236" width="980" height="4" style="fill-opacity:0.8"/><text x="100" y="258" class="lab">Distance</text><text x="180" y="258" class="sub">how far along the course you got, launch to goal</text><rect class="fa" x="335" y="282" width="560" height="4" style="fill-opacity:0.9"/><text x="335" y="304" class="val">Time and leading</text><text x="335" y="320" class="sub">only between the start of speed (SSS) and its end (ESS): how fast, and how far in front</text></svg>
