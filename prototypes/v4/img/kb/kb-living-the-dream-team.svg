f)" font-size="25" font-weight="600" fill="var(--white,#f6f4f4)">Julien</text><text x="1800" y="380" text-anchor="middle" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="20" font-weight="400" fill="#b4b4b4">coach, at home</text><text x="1800" y="402" text-anchor="middle" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="20" font-weight="400" fill="#b4b4b4">radio and live tracking</text><text x="2120" y="355" text-anchor="middle" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="25" font-weight="600" fill="var(--white,#f6f4f4)">Delphine</text><text x="2120" y="380" text-anchor="middle" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="20" font-weight="400" fill="#b4b4b4">mental coach</text><text x="2120" y="402" text-anchor="middle" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="20" font-weight="400" fill="#b4b4b4">by phone when needed</text><text x="1450" y="540" text-anchor="middle" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="21.7" font-weight="400" fill="#b4b4b4" fill-opacity="0.8">among the supporters, the Sherpa walks with him, carries his non-mandatory kit and flies down: fit, and a good pilot</text></svg>
