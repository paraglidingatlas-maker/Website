<svg class="dk dk-cq-team" viewBox="0 0 1200 300" role="img" aria-labelledby="dk-cq-team-t dk-cq-team-d" xmlns="http://www.w3.org/2000/svg"><title id="dk-cq-team-t">Damien Lacaze&#x27;s X-Alps team</title><desc id="dk-cq-team-d">Damien Lacaze&#x27;s X-Alps team. The first time there were three of them; in 2025 there were nine: six supporters in two vans, three in each, the athlete, his coach Julien at home on the radio and live tracking, and his mental coach Delphine on the phone. Among the supporters, the Sherpa walks with him, carries his non-mandatory kit and flies down: fit, and a good pilot.</desc><defs><radialGradient id="dk-cq-team-glow"><stop offset="0" stop-color="#ff7517" stop-opacity=".16"/><stop offset=".45" stop-color="#ff7517" stop-opacity=".05"/><stop offset="1" stop-color="#ff7517" stop-opacity="0"/></radialGradient></defs><circle cx="700" cy="140" r="300" fill="url(#dk-cq-team-glow)"/><text x="40" y="40" class="lab">The first time</text><path class="f" d="M53,130 a7,7 0 1,0 14,0 a7,7 0 1,0 -14,0"/><path class="d" d="M53,130 a7,7 0 1,0 14,0 a7,7 0 1,0 -14,0"/><circle class="fw" cx="60" cy="130" r="3.1"/><path class="f" d="M87,130 a7,7 0 1,0 14,0 a7,7 0 1,0 -14,0"/><path class="d" d="M87,130 a7,7 0 1,0 14,0 a7,7 0 1,0 -14,0"/><circle class="fw" cx="94" cy="130" r="3.1"/><path class="f" d="M121,130 a7,7 0 1,0 14,0 a7,7 0 1,0 -14,0"/><path class="d" d="M121,130 a7,7 0 1,0 14,0 a7,7 0 1,0 -14,0"/><circle class="fw" cx="128" cy="130" r="3.1"/><text x="40" y="178" class="tv">a team of three</text><path class="g" d="M220,30 L220,250"/><text x="260" y="40" class="val">2025: nine</text><path class="f" d="M278,100 h124 a8,8 0 0 1 8,8 v48 a8,8 0 0 1 -8,8 h-124 a8,8 0 0 1 -8,-8 v-48 a8,8 0 0 1 8,-8 Z"/><path class="d" d="M278,100 h124 a8,8 0 0 1 8,8 v48 a8,8 0 0 1 -8,8 h-124 a8,8 0 0 1 -8,-8 v-48 a8,8 0 0 1 8,-8 Z"/><path class="f" d="M293,132 a7,7 0 1,0 14,0 a7,7 0 1,0 -14,0"/><path class="d" d="M293,132 a7,7 0 1,0 14,0 a7,7 0 1,0 -14,0"/><circle class="fw" cx=