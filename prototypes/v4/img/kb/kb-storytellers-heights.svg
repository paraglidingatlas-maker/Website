-anchor="end" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="20" font-weight="400" fill="#b4b4b4" fill-opacity="0.8">1,000 m</text><text x="400" y="110" text-anchor="end" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="20" font-weight="400" fill="#b4b4b4" fill-opacity="0.8">1,200 m</text><text x="400" y="70" text-anchor="end" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="20" font-weight="400" fill="#b4b4b4" fill-opacity="0.8">above the ground</text><text x="800" y="70" text-anchor="middle" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="23.4" font-weight="600" fill="var(--white,#f6f4f4)">FRANCE, 2023 WORLDS</text><text x="830" y="348" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="25" font-weight="600" fill="var(--white,#f6f4f4)">hit at about 600 m</text><text x="830" y="374" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="20" font-weight="400" fill="#b4b4b4">felt like ten seconds, lasted three</text><text x="830" y="464.2" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="21.7" font-weight="400" fill="#b4b4b4">wing open but no brake pressure:</text><text x="830" y="488.2" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="21.7" font-weight="400" fill="#b4b4b4">he went down to land</text><text x="1650" y="70" text-anchor="middle" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="23.4" font-weight="600" fill="var(--white,#f6f4f4)">SPAIN, 2024 EUROPEANS</text><text x="1680" y="160.5" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="25" font-weight="600" fill="var(--white,#f6f4f4)">hit at more than 1,000 m</text><text x="1680" y="186.5" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="20" font-weight="400" fill="#b4b4b4">tangled, spinning, a slow backflip</text><text x="1730" y="389.7" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="25" font-weight="600" fill="var(--white,#f6f4f4)">reserve thrown at 400 to 600 m</text><text x="1730" y="415.7" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="20" font-weight="400" fill="#b4b4b4">the landing was a gamble either way</text><text x="1710" y="588" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="20" font-weight="400" fill="#b4b4b4">between two olive trees</text></svg>
