<svg class="dk dk-cq-heights" viewBox="0 0 1200 360" role="img" aria-labelledby="dk-cq-heights-t dk-cq-heights-d" xmlns="http://www.w3.org/2000/svg"><title id="dk-cq-heights-t">Two collisions, one height scale</title><desc id="dk-cq-heights-d">Marko Milutinovic&#x27;s two mid-air collisions on one height scale. France, 2023 Worlds: hit at about 600 m above the ground (it felt like ten seconds, it lasted three); the wing stayed open but had no brake pressure, and he went down to land. Spain, 2024 Europeans: hit at more than 1,000 m, tangled, spinning, a slow backflip, the reserve thrown at 400 to 600 m, and a landing between two olive trees: a gamble either way.</desc><defs><radialGradient id="dk-cq-heights-glow"><stop offset="0" stop-color="#ff7517" stop-opacity=".16"/><stop offset=".45" stop-color="#ff7517" stop-opacity=".05"/><stop offset="1" stop-color="#ff7517" stop-opacity="0"/></radialGradient></defs><circle cx="820" cy="150" r="260" fill="url(#dk-cq-heights-glow)"/><path class="h" d="M150,320 L1160,320"/><text x="142" y="324" class="tb" text-anchor="end">0 m</text><path class="g" d="M150,275 L1160,275"/><text x="142" y="279" class="tb" text-anchor="end">200 m</text><path class="g" d="M150,230 L1160,230"/><text x="142" y="234" class="tb" text-anchor="end">400 m</text><path class="g" d="M150,185 L1160,185"/><text x="142" y="189" class="tb" text-anchor="end">600 m</text><path class="g" d="M150,140 L1160,140"/><text x="142" y="144" class="tb" text-anchor="end">800 m</text><path class="g" d="M150,95 L1160,95"/><text x="142" y="99" class="tb" text-anchor="end">1,000 m</text><path class="g" d="M150,50 L1160,50"/><text x="142" y="54" class="tb" text-anchor="end">1,200 m</text><text x="142" y="30" class="tb" text-anchor="end">above the ground</text><text x="360" y="30" class="lab" text-anchor="middle">France, 2023 Worlds</text><path class="a" d="M360,185 L360,320" style="stroke-dasharray:5 4"/><circle class="fa" cx="360" cy="185" r="6"/><text x="376" y="181" class="tv">hit at about 600 m</text><text x="376" y="197" class="sub">felt like ten seconds, lasted three</text><text x="376" y="245.8" class="sub">wing open but no brake pressure:</text><text x="376" y="260.8" class="sub">he went down to land</text><text x="820" y="30" class="lab" text-anchor="middle">Spain, 2024 Europeans</text><circle class="fa" cx="820" cy="83.8" r="6"/><text x="836" y="79.8" class="tv">hit at more than 1,000 m</text><text x="836" y="95.8" class="sub">tangled, spinning, a slow backflip</text><path class="a" d="M820,83.8 L822.9,84.8 L825.6,85.8 L827.6,86.8 L828.7,87.9 L829,88.9 L828.2,89.9 L826.5,91 L824.1,92 L821.3,93 L818.3,94.1 L815.5,95.1 L813.2,96.1 L811.6,97.2 L811,98.2 L811.4,99.2 L812.7,100.2 L814.8,101.3 L817.5,102.3 L820.5,103.3 L823.4,104.4 L825.9,105.4 L827.8,106.4 L828.8,107.5 L828.9,108.5 L828,109.5 L826.2,110.6 L823.7,111.6 L820.8,112.6 L817.8,113.7 L815.1,114.7 L812.9,115.7 L811.5,116.8 L811,117.8 L811.5,118.8 L813,119.8 L815.2,120.9 L817.9,121.9 L820.9,122.9 L823.8,124 L826.2,125 L828,126 L828.9,127.1 L828.8,128.1 L827.8,129.1 L825.9,130.2 L823.3,131.2 L820.4,132.2 L817.4,133.2 L814.7,134.3 L812.6,135.3 L811.3,136.3 L811,137.4 L811.7,138.4 L813.2,139.4 L815.6,140.5 L818.4,141.5 L821.3,142.5 L824.2,143.6 L826.6,144.6 L828.2,145.6 L829,146.7 L828.7,147.7 L827.5,148.7 L825.5,149.7 L822.9,150.8 L819.9,151.8 L817,152.8 L814.4,153.9 L812.4,154.9 L811.2,155.9 L811,157 L811.8,158 L813.5,159 L816,160.1 L818.8,161.1 L821.8,162.1 L824.6,163.2 L826.9,164.2 L828.4,165.2 L829,166.2 L828.6,167.3 L827.3,168.3 L825.1,169.3 L822.4,170.4 L819.5,171.4 L816.6,172.4 L814,173.5 L812.2,174.5 L811.1,175.5 L811.1,176.6 L812.1,177.6 L813.9,178.6 L816.4,179.7 L819.3,180.7 L822.2,181.7 L825,182.8 L827.1,183.8 L828.5,184.8 L829,185.8 L828.5,186.9 L827,187.9 L824.8,188.9 L822,190 L819,191 L816.1,192 L813.7,193.1 L811.9,194.1 L811.1,195.1 L811.2,196.2 L812.3,197.2 L814.2,198.2 L816.8,199.2 L819.7,200.3 L822.7,201.3 L825.3,202.3 L827.4,203.4 L828.7,204.4 L829,205.4 L828.