<svg class="dk dk-cq-rescue" viewBox="0 0 1200 360" role="img" aria-labelledby="dk-cq-rescue-t dk-cq-rescue-d" xmlns="http://www.w3.org/2000/svg"><title id="dk-cq-rescue-t">The mirror effect, and one attachment point</title><desc id="dk-cq-rescue-d">The mirror effect and the stand-up alternative, after Eric Roussel. Left, the reserve bridled to the shoulders pulls one way while the paraglider, still on the main carabiners, pulls the other: the pilot is stretched between them on their back. Right, reserve and wing join at the same point and the pilot sits upright, legs free, hands on the risers. Schematic.</desc><defs><radialGradient id="dk-cq-rescue-glow"><stop offset="0" stop-color="#ff7517" stop-opacity=".16"/><stop offset=".45" stop-color="#ff7517" stop-opacity=".05"/><stop offset="1" stop-color="#ff7517" stop-opacity="0"/></radialGradient></defs><circle cx="900" cy="200" r="280" fill="url(#dk-cq-rescue-glow)"/><path class="f" d="M90,125 L90.3,121.6 L91.3,118.1 L92.9,114.8 L95.2,111.6 L98,108.5 L101.5,105.6 L105.4,102.9 L109.9,100.5 L114.7,98.3 L120,96.4 L125.6,94.9 L131.5,93.6 L137.5,92.7 L143.7,92.2 L150,92 L156.3,92.2 L162.5,92.7 L168.5,93.6 L174.4,94.9 L180,96.4 L185.3,98.3 L190.1,100.5 L194.6,102.9 L198.5,105.6 L202,108.5 L204.8,111.6 L207.1,114.8 L208.7,118.1 L209.7,121.6 L210,125 Z"/><path class="o" d="M90,125 L90.3,121.6 L91.3,118.1 L92.9,114.8 L95.2,111.6 L98,108.5 L101.5,105.6 L105.4,102.9 L109.9,100.5 L114.7,98.3 L120,96.4 L125.6,94.9 L131.5,93.6 L137.5,92.7 L143.7,92.2 L150,92 L156.3,92.2 L162.5,92.7 L168.5,93.6 L174.4,94.9 L180,96.4 L185.3,98.3 L190.1,100.5 L194.6,102.9 L198.5,105.6 L202,108.5 L204.8,111.6 L207.1,114.8 L208.7,118.1 L209.7,121.6 L210,125 Z"/><path class="g" d="M90,125 L270.9,236.5"/><path class="g" d="M120,125 L270.9,236.5"/><path class="g" d="M180,125 L270.9,236.5"/><path class="g" d="M210,125 L270.9,236.5"/><path class="o" d="M516.5,122.8 L515.1,120.2 L513.3,117.6 L511.3,115.1 L509.1,112.5 L506.6,110.1 L503.8,107.6 L500.8,105.3 L497