<svg class="dk dk-pt-wph" viewBox="0 0 1600 600" role="img" aria-labelledby="dk-pt-wph-t dk-pt-wph-d" xmlns="http://www.w3.org/2000/svg"><title id="dk-pt-wph-t">A sounding, read the simple way</title><desc id="dk-pt-wph-d">A sounding read the simple way, after Ivelin Kalushkov&#x27;s Manilla example: temperature against height. The early morning line bends back on itself near the ground: warmer above than below, an inversion, the thermal killer. The midday line leans over steadily until a kink where climbs stop; the dew point line comes within three or four degrees of it at cloud base. Behind them, the dry adiabats, worked out at 9.8 degrees per 1,000 m: the rate at which rising dry air cools. Schematic.</desc><defs><radialGradient id="pt-wph-g" gradientUnits="userSpaceOnUse" cx="1249.2" cy="237.6" r="300"><stop offset="0" stop-color="#ff7517" stop-opacity="0.12"/><stop offset="0.4" stop-color="#ff7517" stop-opacity="0.041999999999999996"/><stop offset="1" stop-color="#ff7517" stop-opacity="0"/></radialGradient></defs><circle cx="1249.2" cy="237.6" r="300" fill="url(#pt-wph-g)"/><clipPath id="pt-wph-c"><rect x="706.7" y="73.3" width="826.7" height="460"/></clipPath><path class="g" d="M758.3,533.3 L758.3,73.3"/><text x="758.3" y="551.3" class="tb" text-anchor="middle">0°</text><path class="g" d="M887.5,533.3 L887.5,73.3"/><text x="887.5" y="551.3" class="tb" text-anchor="middle">5°</text><path class="g" d="M1016.7,533.3 L1016.7,73.3"/><text x="1016.7" y="551.3" class="tb" text-anchor="middle">10°</text><path class="g" d="M1145.8,533.3 L1145.8,73.3"/><text x="1145.8" y="551.3" class="tb" text-anchor="middle">15°</text><path class="g" d="M1275,533.3 L1275,73.3"/><text x="1275" y="551.3" class="tb" text-anchor="middle">20°</text><path class="g" d="M1404.2,533.3 L1404.2,73.3"/><text x="1404.2" y="551.3" class="tb" text-anchor="middle">25°</text><path class="g" d="M1533.3,533.3 L1533.3,73.3"/><text x="1533.3" y="551.3" class="tb" text-anchor="middle">30°</text><path class="h" d="M706.7,533.3 L1533.3,533.3"/><path class="g" d="M706.7,467.6 L1533.3,467.6"/><text x="696.7" y="471.6" class="tb" text-anchor="end">500 m</text><path class="g" d="M706.7,401.9 L1533.3,401.9"/><text x="696.7" y="405.9" class="tb" text-anchor="end">1,000 m</text><path class="g" d="M706.7,336.2 L1533.3,336.2"/><text x="696.7" y="340.2" class="tb" text-anchor="end">1,500 m</text><path class="g" d="M706.7,270.5 L1533.3,270.5"/><text x="696.7" y="274.5" class="tb" text-anchor="end">2,000 m</text><path class="g" d="M706.7,204.8 L1533.3,204.8"/><text x="696.7" y="208.8" class="tb" text-anchor="end">2,500 m</text><path class="g" d="M706.7,139 L1533.3,139"/><text x="696.7" y="143" class="tb" text-anchor="end">3,000 m</text><path class="g" d="M706.7,73.3 L1533.3,73.3"/><text x="696.7" y="77.3" class="tb" text-anchor="end">3,500 m</text><text x="1533.3" y="571.3" class="tb" text-anchor="end">temperature</text><g clip-path="url(#pt-wph-c)"><path d="M758.3,533.3 L-127.7,73.3" fill="none" stroke="#ff7517" stroke-opacity=".14" stroke-width=".75" vector-effect="non-scaling-stroke"/><path d="M887.5,533.3 L1.4,73.3" fill="none" stroke="#ff7517" stroke-opacity=".14" stroke-width=".75" vector-effect="non-scaling-stroke"/><path d="M1016.7,533.3 L130.6,73.3" fill="none" stroke="#ff7517" stroke-opacity=".14" stroke-width=".75" vector-effect="non-scaling-stroke"/><path d="M1145.8,533.3 L259.8,73.3" fill="none" stroke="#ff7517" stroke-opacity=".14" stroke-width=".75" vector-effect="non-scaling-stroke"/><path d="M1275,533.3 L388.9,73.3" fill="none" stroke="#ff7517" stroke-opacity=".14" stroke-width=".75" vector-effect="non-scaling-stroke"/><path d="M1404.2,533.3 L518.1,73.3" fill="none" stroke="#ff7517" stroke-opacity=".14" stroke-width=".75" vector-effect="non-scaling-stroke"/><path d="M1533.3,533.3 L647.2,73.3" fill="none" stroke="#ff7517" stroke-opacity=".14" stroke-width=".75" vector-effect="non-scaling-stroke"/><path d="M1662.5,533.3 L776.4,73.3" fill="none" stroke="#ff7517" stroke-opacity=".14" stroke-width=".75" vector-effect="non-scaling-stroke"/><path d="M1791.7,533.3 L905.6,73.3" fill="none" stroke="#ff7517" stroke-opacity=".14" stroke-width=".75" vector-effect="non-scaling-stroke"/><path d="M1920.8,533.3 L1034.8,73.3" fill="none" stroke="#ff7517" stroke-opacity=".14" stroke-width=".75" vector-effect="non-scaling-stroke"/><path d="M2050,533.3 L1163.9,73.3" fill="none" stroke="#ff7517" stroke-opacity=".14" stroke-width=".75" vector-effect="non-scaling-stroke"/><path d="M2179.2,533.3 L1293.1,73.3" fill="none" stroke="#ff7517" stroke-opacity=".14" stroke-width=".75" vector-effect="non-scaling-stroke"/><path d="M2308.3,533.3 L1422.2,73.3" fill="none" stroke="#ff7517" stroke-opacity=".14" stroke-width=".75" vector-effect="non-scaling-stroke"/><path d="M2437.5,533.3 L1551.4,73.3" fill="none" stroke="#ff7517" stroke-opacity=".14" stroke-width=".75" vector-effect="non-scaling-stroke"/><path d="M2566.7,533.3 L1680.6,73.3" fill="none" stroke="#ff7517" stroke-opacity=".14" stroke-width=".75" vector-effect="non-scaling-stroke"/></g><text x="1520.4" y="125.9" class="sub" text-anchor="end">dry adiabats: 9.8° per 1,000 m</text><path class="d" d="M1171.7,533.3 L1094.2,428.2 L1120,395.3 L1063.2,309.9" style="stroke-dasharray:5 4"/><path class="h" d="M1125,395.3 L1295.8,382.2"/><text x="1300.8" y="380.2" class="tv">8 am: warmer above than below</text><text x="1300.8" y="396.2" class="sub">an inversion, the thermal killer</text><path d="M1468.8,533.3 L1300.8,441.3 L1132.9,349.3 L972.8,257.3 L895.2,198.2 L908.2,165.3 L822.9,73.3" fill="none" stroke="#ff7517" stroke-opacity="1" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path d="M1068.3,533.3 L1024.4,401.9 L985.7,309.9 L897.8,237.6 L810,185 L719.6,125.9 L706.7,73.3" fill="none" stroke="#f6f4f4" stroke-opacity="0.85" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/><path class="h" d="M706.7,237.6 L1533.3,237.6" style="stroke-dasharray:2 5"/><circle cx="1249.2" cy="214.6" r="31" fill="#f6f4f4" fill-opacity=".1"/><circle cx="1216.2" cy="225.6" r="23" fill="#f6f4f4" fill-opacity=".1"/><circle cx="1282.2" cy="224.6" r="25" fill="#f6f4f4" fill-opacity=".1"/><circle cx="1236.2" cy="198.6" r="23" fill="#f6f4f4" fill-opacity=".1"/><circle cx="1268.2" cy="202.6" r="20" fill="#f6f4f4" fill-opacity=".1"/><text x="1309.2" y="217.6" class="lab">cloud base</text><text x="1309.2" y="233.6" class="sub">lines within 3 to 4 degrees</text><path class="a" d="M887.2,198.2 a8,8 0 1,0 16,0 a8,8 0 1,0 -16,0"/><path class="h" d="M904.2,194.2 L975.2,151.2"/><text x="981.2" y="146.2" class="val">the kink: climbs stop here</text><text x="1197.5" y="296.8" class="tv">midday: the more it leans,</text><text x="1197.5" y="311.8" class="sub">the better the thermals</text><text x="1014.4" y="405.9" class="tv" text-anchor="end">dew point</text><text x="1533.3" y="53.3" class="tb" text-anchor="end">schematic: after the Manilla forecast in the conversation</text></svg>
