<svg class="dk dk-cp-weight" viewBox="0 0 1200 300" role="img" aria-labelledby="dk-cp-weight-t dk-cp-weight-d" xmlns="http://www.w3.org/2000/svg"><title id="dk-cp-weight-t">Performance gap by pilot weight</title><desc id="dk-cp-weight-d">The size of the weight problem, by pilot all-up weight from 40 to 125 kg: the band drag noodles address, 100 to 125 kg, about 5% difference in performance, against the gap between an extra small and an extra large, 65 to 125 kg, about 20%. Bruce Goldsmith&#x27;s figures; MRT is aimed at the whole range, down to 40 kg pilots.</desc><defs><radialGradient id="dk-cp-weight-glow"><stop offset="0" stop-color="#ff7517" stop-opacity=".16"/><stop offset=".45" stop-color="#ff7517" stop-opacity=".05"/><stop offset="1" stop-color="#ff7517" stop-opacity="0"/></radialGradient></defs><circle cx="800" cy="120" r="300" fill="url(#dk-cp-weight-glow)"/><path class="d" d="M140,200 L1040,200"/><path class="h" d="M140,195 L140,205"/><text x="140" y="220" class="tb" text-anchor="middle">40</text><path class="h" d="M245.9,195 L245.9,205"/><text x="245.9" y="220" class="tb" text-anchor="middle">50</text><path class="h" d="M351.8,195 L351.8,205"/><text x="351.8" y="220" class="tb" text-anchor="middle">60</text><path class="h" d="M457.6,195 L457.6,205"/><text x="457.6" y="220" class="tb" text-anchor="middle">70</text><path class="h" d="M563.5,195 L563.5,205"/><text x="563.5" y="220" class="tb" text-anchor="middle">80</text><path class="h" d="M669.4,195 L669.4,205"/><text x="669.4" y="220" class="tb" text-anchor="middle">90</text><path class="h" d="M775.3,195 L775.3,205"/><text x="775.3" y="220" class="tb" text-anchor="middle">100</text><path class="h" d="M881.2,195 L881.2,205"/><text x="881.2" y="220" class="tb" text-anchor="middle">110</text><path class="h" d="M987.1,195 L987.1,205"/><text x="987.1" y="220" class="tb" text-anchor="middle">120</text><text x="1048" y="220" class="tb">kg</text><rect class="fa" x="404.7" y="70" width="635.3" height="30" style="fill-opacity:0.22"/><path class="g" d="M404.7,70 L404.7,200"/><path class="g" d="M1040,70 L1040,200"/><text x="722.4" y="90" class="val" text-anchor="middle">about 20%</text><text x="722.4" y="58" class="sub" text-anchor="middle">extra small against extra large</text><rect class="fh" x="775.3" y="138" width="264.7" height="30" style="fill-opacity:0.3"/><text x="907.6" y="158" class="lab" text-anchor="middle">about 5%</text><text x="765.3" y="158" class="sub" text-anchor="end">what drag noodles can adjust</text><text x="140" y="262" class="lab">Performance gap by pilot weight</text><text x="140" y="280" class="sub">Bruce Goldsmith&#x27;s figures; MRT is aimed at the whole range, down to 40 kg pilots</text></svg>
