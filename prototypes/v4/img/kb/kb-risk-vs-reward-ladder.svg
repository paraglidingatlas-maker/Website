<svg class="dk dk-cq-ladder" viewBox="0 0 1200 330" role="img" aria-labelledby="dk-cq-ladder-t dk-cq-ladder-d" xmlns="http://www.w3.org/2000/svg"><title id="dk-cq-ladder-t">Three hazard levels</title><desc id="dk-cq-ladder-d">Will Gadd&#x27;s three hazard levels, as a ladder: bumps and bruises, play; hospital, slow down, keep a hand on the wall, choose the inside of the trail; death, find the line that removes this row before you look at the odds. Probability is the second question: the row decides, not the odds.</desc><defs><radialGradient id="dk-cq-ladder-glow"><stop offset="0" stop-color="#ff7517" stop-opacity=".16"/><stop offset=".45" stop-color="#ff7517" stop-opacity=".05"/><stop offset="1" stop-color="#ff7517" stop-opacity="0"/></radialGradient></defs><circle cx="700" cy="250" r="300" fill="url(#dk-cq-ladder-glow)"/><path class="f" d="M64,30 h892 a4,4 0 0 1 4,4 v64 a4,4 0 0 1 -4,4 h-892 a4,4 0 0 1 -4,-4 v-64 a4,4 0 0 1 4,-4 Z"/><path class="d" d="M64,30 h892 a4,4 0 0 1 4,4 v64 a4,4 0 0 1 -4,4 h-892 a4,4 0 0 1 -4,-4 v-64 a4,4 0 0 1 4,-4 Z"/><rect class="fh" x="60" y="30" width="5" height="72" style="fill-opacity:0.95"/><text x="86" y="60" class="tt">Bumps and bruises</text><text x="86" y="84" class="tv">Play. Pay attention, nothing more.</text><rect class="fh" x="700" y="56" width="48.4" height="6" style="fill-opacity:0.95"/><path class="g" d="M700,72 L920,72"/><text x="700" y="88" class="tb">consequence</text><path class="f" d="M64,118 h892 a4,4 0 0 1 4,4 v64 a4,4 0 0 1 -4,4 h-892 a4,4 0 0 1 -4,-4 v-64 a4,4 0 0 1 4,-4 Z"/><path class="d" d="M64,118 h892 a4,4 0 0 1 4,4 v64 a4,4 0 0 1 -4,4 h-892 a4,4 0 0 1 -4,-4 v-64 a4,4 0 0 1 4,-4 Z"/><rect class="fa" x="60" y="118" width="5" height="72" style="fill-opacity:0.5"/><text x="86" y="148" class="tt">Hospital</text><text x="86" y="172" class="tv">Slow down, keep a hand on the wall, choose the inside of the trail.</text><rect class="fa" x="700" y="144" width="121" height="6" style="fill-opacity:0.5"/><path class="g" d="M700,160 L920,160"/><text x="700" y="176" class="tb">consequence</text><path class="f" d="M64,206 h892 a4,4 0 0 1 4,4 v64 a4,4 0 0 1 -4,4 h-892 a4,4 0 0 1 -4,-4 v-64 a4,4 0 0 1 4,-4 Z"/><path class="d" d="M64,206 h892 a4,4 0 0 1 4,4 v64 a4,4 0 0 1 -4,4 h-892 a4,4 0 0 1 -4,-4 v-64 a4,4 0 0 1 4,-4 Z"/><rect class="fa" x="60" y="206" width="5" height="72" style="fill-opacity:0.95"/><text x="86" y="236" class="tt">Death</text><text x="86" y="260" class="tv">Find the line that removes this row before you look at the odds.</text><rect class="fa" x="700" y="232" width="220" height="6" style="fill-opacity:0.95"/><path class="g" d="M700,248 L920,248"/><text x="700" y="264" class="tb">consequence</text><path class="h" d="M1020,160 A50,50 0 0,1 1120,160"/><path class="h" d="M1034,160 A36,36 0 0,1 1106,160"/><path class="h" d="M1106,160 L1120,160"/><path class="h" d="M1101.2,142 L1113.3,135"/><path class="h" d="M1088,128.8 L1095,116.7"/><path class="h" d="M1070,124 L1070,110"/><path class="h" d="M1052,128.8 L1045,116.7"/><path class="h" d="M1038.8,142 L1026.7,135"/><path class="h" d="M1034,160 L1020,160"/><path class="d" d="M1070,160 L1041.6,136.2"/><path class="fh" d="M1037.8,133 L1044.6,135.8 L1041.7,139.2 Z"/><text x="1070" y="182" class="sub" text-anchor="middle">probability</text><text x="1070" y="198" class="tb" text-anchor="middle">the second question</text></svg>
