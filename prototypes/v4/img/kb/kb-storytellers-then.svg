<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 620"><polyline points="610,115 2280,115" fill="none" stroke="#b4b4b4" stroke-width="0.6" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-opacity="0.1" stroke-linecap="round"/><polyline points="610,265 2280,265" fill="none" stroke="#b4b4b4" stroke-width="0.6" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-opacity="0.1" stroke-linecap="round"/><polyline points="610,415 2280,415" fill="none" stroke="#b4b4b4" stroke-width="0.6" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-opacity="0.1" stroke-linecap="round"/><line x1="1330" y1="170" x2="1420" y2="170" fill="none" stroke="var(--orange,#ff7517)" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-opacity="0.8"/><polygon points="1430,170 1413.3,176.9 1413.3,163.1" fill="var(--orange,#ff7517)" fill-opacity="0.8"/><line x1="1330" y1="320" x2="1420" y2="320" fill="none" stroke="var(--orange,#ff7517)" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-opacity="0.8"/><polygon points="1430,320 1413.3,326.9 1413.3,313.1" fill="var(--orange,#ff7517)" fill-opacity="0.8"/><line x1="1330" y1="470" x2="1420" y2="470" fill="none" stroke="var(--orange,#ff7517)" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-opacity="0.8"/><polygon points="1430,470 1413.3,476.9 1413.3,463.1" fill="var(--orange,#ff7517)" fill-opacity="0.8"/><text x="640" y="70" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="23.4" font-weight="600" fill="#b4b4b4">EARLY 1990s</text><text x="1480" y="70" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="23.4" font-weight="600" fill="var(--orange,#ff7517)">NOW</text><text x="560" y="170" text-anchor="end" dominant-baseline="central" font-family="var(--font-display,'Poppins',sans-serif)" font-size="27.9" font-weight="600" fill="var(--white,#f6f4f4)">Cross-country</text><text x="640" y="156" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="25" font-weight="400" fill="#b4b4b4">a handful in the club;</text><text x="640" y="186" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="25" font-weight="400" fill="#b4b4b4">20 to 50 km flights in the UK</text><text x="1480" y="156" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="25" font-weight="400" fill="var(--white,#f6f4f4)">at least half of UK club pilots expect to;</text><text x="1480" y="186" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="25" font-weight="400" fill="var(--white,#f6f4f4)">keen pilots fly 100 km in their first couple of years</text><text x="560" y="320" text-anchor="end" dominant-baseline="central" font-family="var(--font-display,'Poppins',sans-serif)" font-size="27.9" font-weight="600" fill="var(--white,#f6f4f4)">Hours</text><text x="640" y="306" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="25" font-weight="400" fill="#b4b4b4">over 100 hours made you a rock star;</text><text x="640" y="336" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="25" font-weight="400" fill="#b4b4b4">a first logbook full of one-minute flights</text><text x="1480" y="306" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="25" font-weight="400" fill="var(--white,#f6f4f4)">150 hours in your first year,</text><text x="1480" y="336" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="25" font-weight="400" fill="var(--white,#f6f4f4)">if you live in the right country</text><text x="560" y="470" text-anchor="end" dominant-baseline="central" font-family="var(--font-display,'Poppins',sans-serif)" font-size="27.9" font-weight="600" fill="var(--white,#f6f4f4)">Competition wings</text><text x="640" y="456" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="25" font-weight="400" fill="#b4b4b4">expect massive collapses</text><text x="640" y="486" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="25" font-weight="400" fill="#b4b4b4">on every good day</text><text x="1480" y="456" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="25" font-weight="400" fill="var(--white,#f6f4f4)">vastly improved,</text><text x="1480" y="486" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="25" font-weight="400" fill="var(--white,#f6f4f4)">and safer</text></svg>
