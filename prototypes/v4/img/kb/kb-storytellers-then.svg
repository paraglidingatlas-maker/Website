<svg class="dk dk-cq-then" viewBox="0 0 1200 300" role="img" aria-labelledby="dk-cq-then-t dk-cq-then-d" xmlns="http://www.w3.org/2000/svg"><title id="dk-cq-then-t">Then and now</title><desc id="dk-cq-then-d">Then and now, as Eddie Colfox tells it. Cross-country: in the early 1990s a handful in the club, 20 to 50 km flights in the UK; now at least half of UK club pilots expect to, and keen pilots fly 100 km in their first couple of years. Hours: over 100 made you a rock star, a first logbook full of one-minute flights; now 150 hours in your first year, if you live in the right country. Competition wings: expect massive collapses on every good day; now vastly improved, and safer.</desc><defs><radialGradient id="dk-cq-then-glow"><stop offset="0" stop-color="#ff7517" stop-opacity=".16"/><stop offset=".45" stop-color="#ff7517" stop-opacity=".05"/><stop offset="1" stop-color="#ff7517" stop-opacity="0"/></radialGradient></defs><circle cx="900" cy="150" r="300" fill="url(#dk-cq-then-glow)"/><text x="300" y="30" class="vw">Early 1990s</text><text x="740" y="30" class="val">Now</text><path class="g" d="M280,44 L1160,44"/><text x="260" y="70" class="lab" text-anchor="end">Cross-country</text><text x="300" y="70" class="sub">a handful in the club;</text><text x="300" y="88" class="sub">20 to 50 km flights in the UK</text><path class="a" d="M650,74 L704.4,74"/><path class="fa" d="M710,74 L702,76.6 L702,71.4 Z"/><text x="740" y="70" class="tv">at least half of UK club pilots expect to;</text><text x="740" y="88" class="tv">keen pilots fly 100 km in their first couple of years</text><path class="g" d="M280,124 L1160,124"/><text x="260" y="150" class="lab" text-anchor="end">Hours</text><text x="300" y="150" class="sub">over 100 hours made you a rock star;</text><text x="300" y="168" class="sub">a first logbook full of one-minute flights</text><path class="a" d="M650,154 L704.4,154"/><path class="fa" d="M710,154 L702,156.6 L702,151.4 Z"/><text x="740" y="150" class="tv">150 hours in your first year,</text><text x="740" y="168" class="tv">if you live in the right country</text><path class="g" d="M280,204 L1160,204"/><text x="260" y="230" class="lab" text-anchor="end">Competition wings</text><text x="300" y="230" class="sub">expect massive collapses</text><text x="300" y="248" class="sub">on every good day</text><path class="a" d="M650,234 L704.4,234"/><path class="fa" d="M710,234 L702,236.6 L702,231.4 Z"/><text x="740" y="230" class="tv">vastly improved,</text><text x="740" y="248" class="tv">and safer</text></svg>
