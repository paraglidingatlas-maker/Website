<svg class="dk dk-ds-money" viewBox="0 0 1200 500" role="img" aria-labelledby="dk-ds-money-t dk-ds-money-d" xmlns="http://www.w3.org/2000/svg"><title id="dk-ds-money-t">The underlying problem is money, after Bill Hughes and Goran Dimiskovski</title><desc id="dk-ds-money-d">People hold several roles because the sport is run on amateur budgets; paid staff, broadcasting and sponsors would change that. Bill Hughes and Goran Dimiskovski, Episode 60, chapter 5. Schematic.</desc><defs><radialGradient id="dk-ds-money-glow"><stop offset="0" stop-color="#ff7517" stop-opacity=".16"/><stop offset=".45" stop-color="#ff7517" stop-opacity=".05"/><stop offset="1" stop-color="#ff7517" stop-opacity="0"/></radialGradient></defs><circle cx="900" cy="250" r="260" fill="url(#dk-ds-money-glow)"/><text x="640" y="96" class="vw">The underlying problem is money</text><path class="o" d="M705,218 a15,15 0 1,0 30,0 a15,15 0 1,0 -30,0"/><path class="f" d="M690,262 c0,-30 60,-30 60,0 v34 h-60 Z"/><path class="o" d="M690,262 c0,-30 60,-30 60,0 v34 h-60 Z"/><path class="f" d="M764,222 h58 v18 h-58 Z"/><path class="d" d="M764,222 h58 v18 h-58 Z"/><path class="f" d="M764,248 h58 v18 h-58 Z"/><path class="d" d="M764,248 h58 v18 h-58 Z"/><path class="f" d="M764,274 h58 v18 h-58 Z"/><path class="d" d="M764,274 h58 v18 h-58 Z"/><text x="684" y="336" class="lab">Several roles</text><text x="684" y="354" class="sub">the sport is run on amateur budgets</text><path class="a" d="M850,250 L923,250"/><path class="fa" d="M930,250 L920,253.2 L920,246.8 Z"/><path class="f" d="M960,186 h170 v34 h-170 Z"/><path class="d" d="M960,186 h170 v34 h-170 Z"/><text x="980" y="208" class="tv">paid staff</text><path class="f" d="M960,238 h170 v34 h-170 Z"/><path class="d" d="M960,238 h170 v34 h-170 Z"/><text x="980" y="260" class="tv">broadcasting</text><path class="f" d="M960,290 h170 v34 h-170 Z"/><path class="d" d="M960,290 h170 v34 h-170 Z"/><text x="980" y="312" class="tv">sponsors</text><text x="960" y="364" class="val">would change that</text><text x="1180" y="470" class="tb" text-anchor="end">Bill Hughes &amp; Goran Dimiskovski, Ep. 60, ch. 5 · schematic</text></svg>
