<svg class="dk dk-pt-sgs" viewBox="0 0 1600 667" role="img" aria-labelledby="dk-pt-sgs-t dk-pt-sgs-d" xmlns="http://www.w3.org/2000/svg"><title id="dk-pt-sgs-t">Turning back in the lee</title><desc id="dk-pt-sgs-d">Turning back, after Honorin Hamard calling off a record attempt. A ridge with the wind coming over it, the rough air in its lee, a pilot&#x27;s track arriving downwind of it, three frontal collapses marked, and the track turning away to land. Schematic.</desc><defs><radialGradient id="pt-sgs-l" gradientUnits="userSpaceOnUse" cx="666.7" cy="173.3" r="400"><stop offset="0" stop-color="#8d8d8d" stop-opacity="0.12"/><stop offset="0.4" stop-color="#8d8d8d" stop-opacity="0.041999999999999996"/><stop offset="1" stop-color="#8d8d8d" stop-opacity="0"/></radialGradient><linearGradient id="pt-sgs-f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#737373" stop-opacity="0.22"/><stop offset="1" stop-color="#141519" stop-opacity="0"/></linearGradient><linearGradient id="pt-sgs-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2b33" stop-opacity="1"/><stop offset="1" stop-color="#141519" stop-opacity="1"/></linearGradient><linearGradient id="pt-sgs-fl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#141519" stop-opacity="1"/><stop offset="1" stop-color="#141519" stop-opacity="0"/></linearGradient><radialGradient id="pt-sgs-rot" gradientUnits="userSpaceOnUse" cx="1173.3" cy="373.3" r="113.3"><stop offset="0" stop-color="#8d8d8d" stop-opacity="0.22"/><stop offset="0.4" stop-color="#8d8d8d" stop-opacity="0.077"/><stop offset="1" stop-color="#8d8d8d" stop-opacity="0"/></radialGradient><radialGradient id="pt-sgs-b" gradientUnits="userSpaceOnUse" cx="1486.7" cy="466.7" r="90"><stop offset="0" stop-color="#ff7517" stop-opacity="0.3"/><stop offset="0.4" stop-color="#ff7517" stop-opacity="0.105"/><stop offset="1" stop-color="#ff7517" stop-opacity="0"/></radialGradient></defs><circle cx="666.7" cy="173.3" r="400" fill="url(#pt-sgs-l)"/><path d="M60