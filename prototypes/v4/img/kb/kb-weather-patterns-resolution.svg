<svg class="dk dk-cs-res" viewBox="0 0 1200 360" role="img" aria-labelledby="dk-cs-res-t dk-cs-res-d" xmlns="http://www.w3.org/2000/svg"><title id="dk-cs-res-t">What a model&#x27;s resolution means</title><desc id="dk-cs-res-d">What a model&#x27;s resolution means, as Ivelin Kalushkov explains it: the forecast for a point covers the area around it; if rain falls anywhere inside, the model counts itself right. His figures: GFS about 22 km, ECMWF about 9 km, NEMS down to 4 km. Each circle is that many kilometres across, all to one scale.</desc><defs><radialGradient id="dk-cs-res-glow"><stop offset="0" stop-color="#ff7517" stop-opacity=".16"/><stop offset=".45" stop-color="#ff7517" stop-opacity=".05"/><stop offset="1" stop-color="#ff7517" stop-opacity="0"/></radialGradient></defs><circle cx="300" cy="170" r="260" fill="url(#dk-cs-res-glow)"/><circle cx="300" cy="160" r="110" class="fa" style="fill-opacity:.08"/><path class="a" d="M190,160 a110,110 0 1,0 220,0 a110,110 0 1,0 -220,0"/><circle class="fw" cx="300" cy="160" r="3.5"/><text x="300" y="296" class="lab" text-anchor="middle">GFS</text><text x="300" y="314" class="val" text-anchor="middle">about 22 km</text><circle cx="700" cy="160" r="45" class="fa" style="fill-opacity:.08"/><path class="a" d="M655,160 a45,45 0 1,0 90,0 a45,45 0 1,0 -90,0"/><circle class="fw" cx="700" cy="160" r="3.5"/><text x="700" y="231" class="lab" text-anchor="middle">ECMWF</text><text x="700" y="249" class="val" text-anchor="middle">about 9 km</text><circle cx="960" cy="160" r="20" class="fa" style="fill-opacity:.08"/><path class="a" d="M940,160 a20,20 0 1,0 40,0 a20,20 0 1,0 -40,0"/><circle class="fw" cx="960" cy="160" r="3.5"/><text x="960" y="216" class="lab" text-anchor="middle">NEMS</text><text x="960" y="234" class="val" text-anchor="middle">down to 4 km</text><path class="f" d="M366,94 a11,11 0 1,0 22,0 a11,11 0 1,0 -22,0"/><path class="h" d="M366,94 a11,11 0 1,0 22,0 a11,11 0 1,0 -22,0"/><path class="f" d="M359,99 a8,8 0 1,0 16,0 a8,8 0 1,0 -16,0"/><path class="h" d="M359,99 a8,8 0 1,0 16,0 a8,8 0 1,0 -16,0"/><path class="f" d="M378.5,99 a8.5,8.5 0 1,0 17,0 a8.5,8.5 0 1,0 -17,0"/><path class="h" d="M378.5,99 a8.5,8.5 0 1,0 17,0 a8.5,8.5 0 1,0 -17,0"/><path class="h" d="M368,110 L366,119"/><path class="h" d="M374,110 L372,119"/><path class="h" d="M380,110 L378,119"/><path class="h" d="M386,110 L384,119"/><path class="h" d="M393,88 L447,58 L461,58"/><text x="467" y="56" class="lab">rain here still counts</text><text x="467" y="72" class="sub">as a correct forecast for the centre</text><path class="o" d="M1080,300 L1180,300"/><text x="1130" y="320" class="tb" text-anchor="middle">10 km</text><text x="1180" y="350" class="tb" text-anchor="end">his figures, as he gives them · one scale</text></svg>
