.5,74" fill="var(--orange,#ff7517)"/><polyline points="1330,236 1330,248" fill="none" stroke="var(--orange,#ff7517)" stroke-width="1.2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-opacity="0.9" stroke-linecap="round"/><rect x="1966" y="214" width="28" height="26" fill="#2a2b33" stroke="var(--orange,#ff7517)" stroke-width="1.2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><polyline points="2020,214 2020,236" fill="none" stroke="var(--orange,#ff7517)" stroke-width="1" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-opacity="0.9" stroke-linecap="round"/><text x="205" y="165" text-anchor="end" dominant-baseline="central" font-family="var(--font-display,'Poppins',sans-serif)" font-size="29" font-weight="600" fill="var(--orange,#ff7517)">1.5 m</text><text x="420" y="470" text-anchor="middle" dominant-baseline="central" font-family="var(--font-display,'Poppins',sans-serif)" font-size="31.1" font-weight="600" fill="var(--white,#f6f4f4)">Drop test</text><text x="420" y="500" text-anchor="middle" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="23.4" font-weight="400" fill="#b4b4b4">head form must see under 250 G</text><text x="420" y="526" text-anchor="middle" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="20" font-weight="400" fill="#8a8a8a">a good new helmet: 170 to 180 G</text><text x="1342" y="242" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="23.4" font-weight="600" fill="var(--orange,#ff7517)">5 mm gap</text><text x="1200" y="470" text-anchor="middle" dominant-baseline="central" font-family="var(--font-display,'Poppins',sans-serif)" font-size="31.1" font-weight="600" fill="var(--white,#f6f4f4)">Penetration</text><text x="1200" y="500" text-anchor="middle" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="23.4" font-weight="400" fill="#b4b4b4">a falling point must stop 5 mm short of the head</text><text x="1200" y="526" text-anchor="middle" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="20" font-weight="400" fill="#8a8a8a">vented bike and climbing shells fail here</text><text x="2030" y="225" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="23.4" font-weight="600" fill="var(--orange,#ff7517)">5 mm max</text><text x="1980" y="470" text-anchor="middle" dominant-baseline="central" font-family="var(--font-display,'Poppins',sans-serif)" font-size="31.1" font-weight="600" fill="var(--white,#f6f4f4)">Nothing to snag</text><text x="1980" y="500" text-anchor="middle" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="23.4" font-weight="400" fill="#b4b4b4">shell parts, mounts and cameras: 5 mm or less</text><text x="1980" y="526" text-anchor="middle" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="20" font-weight="400" fill="#8a8a8a">a line round a camera is the failure mode</text></svg>
