<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 760"><rect x="540" y="330" width="560" height="50" fill="var(--orange,#ff7517)" fill-opacity="0.2"/><rect x="540" y="80" width="560" height="250" fill="var(--orange,#ff7517)" fill-opacity="0.4"/><rect x="1280" y="150" width="330" height="420" fill="#1b1c22" fill-opacity="0.9" stroke="#b4b4b4" stroke-width="0.7" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-opacity="0.9"/><rect x="1650" y="150" width="330" height="420" fill="#1b1c22" fill-opacity="0.9" stroke="#b4b4b4" stroke-width="0.7" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-opacity="0.9"/><rect x="2020" y="150" width="330" height="420" fill="#1b1c22" fill-opacity="0.9" stroke="#b4b4b4" stroke-width="0.7" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-opacity="0.9"/><polyline points="520,80 520,680" fill="none" stroke="#b4b4b4" stroke-width="1" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-opacity="0.7" stroke-linecap="round"/><polyline points="506,680 534,680" fill="none" stroke="#b4b4b4" stroke-width="0.8" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-opacity="0.6" stroke-linecap="round"/><polyline points="506,580 534,580" fill="none" stroke="#b4b4b4" stroke-width="0.8" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-opacity="0.6" stroke-linecap="round"/><polyline points="506,480 534,480" fill="none" stroke="#b4b4b4" stroke-width="0.8" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-opacity="0.6" stroke-linecap="round"/><polyline points="506,380 534,380" fill="none" stroke="#b4b4b4" stroke-width="0.8" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-opacity="0.6" stroke-linecap="round"/><polyline points="506,280 534,280" fill="none" stroke="#b4b4b4" stroke-width="0.8" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-opacity="0.6" stroke-linecap="round"/><polyline points="506,180 534,180" fill="none" stroke="#b4b4b4" stroke-width="0.8" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-opacity="0.6" stroke-linecap="round"/><polyline points="506,80 534,80" fill="none" stroke="#b4b4b4" stroke-width="0.8" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-opacity="0.6" stroke-linecap="round"/><polyline points="540,420 1100,420" fill="none" stroke="#b4b4b4" stroke-width="0.7" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-opacity="0.5" stroke-dasharray="5.6 5.6" stroke-linecap="round"/><rect x="1280" y="150" width="330" height="4" fill="var(--orange,#ff7517)"/><rect x="1650" y="150" width="330" height="4" fill="var(--orange,#ff7517)"/><rect x="2020" y="150" width="330" height="4" fill="var(--orange,#ff7517)"/><text x="490" y="680" text-anchor="end" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="22.2" font-weight="400" fill="#b4b4b4">0 m</text><text x="490" y="580" text-anchor="end" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="22.2" font-weight="400" fill="#b4b4b4">1,000 m</text><text x="490" y="480" text-anchor="end" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="22.2" font-weight="400" fill="#b4b4b4">2,000 m</text><text x="490" y="380" text-anchor="end" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="22.2" font-weight="400" fill="#b4b4b4">3,000 m</text><text x="490" y="280" text-anchor="end" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="22.2" font-weight="400" fill="#b4b4b4">4,000 m</text><text x="490" y="180" text-anchor="end" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="22.2" font-weight="400" fill="#b4b4b4">5,000 m</text><text x="490" y="80" text-anchor="end" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="22.2" font-weight="400" fill="#b4b4b4">6,000 m</text><text x="560" y="355" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="25" font-weight="400" fill="var(--white,#f6f4f4)">most pilots start to be affected</text><text x="560" y="210" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="25" font-weight="400" fill="var(--white,#f6f4f4)">impaired, and not aware of it</text><text x="560" y="530" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="25" font-weight="400" fill="#b4b4b4">fine</text><text x="560" y="404" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="19.5" font-weight="400" fill="#8a8a8a">general aviation: 30 min above 3,000 m, or any time above 4,000 m</text><text x="1445" y="240" text-anchor="middle" dominant-baseline="central" font-family="var(--font-display,'Poppins',sans-serif)" font-size="80.6" font-weight="600" fill="var(--orange,#ff7517)">x5</text><text x="1304" y="315" text-anchor="start" dominant-baseline="central" font-family="var(--font-display,'Poppins',sans-serif)" font-size="33.4" font-weight="600" fill="var(--white,#f6f4f4)">Cold</text><text x="1304" y="360" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="23.6" font-weight="400" fill="#b4b4b4">Shivering multiplies the</text><text x="1304" y="392" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="23.6" font-weight="400" fill="#b4b4b4">oxygen your body burns by</text><text x="1304" y="424" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="23.6" font-weight="400" fill="#b4b4b4">about five. Staying warm</text><text x="1304" y="456" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="23.6" font-weight="400" fill="#b4b4b4">is margin.</text><text x="1815" y="240" text-anchor="middle" dominant-baseline="central" font-family="var(--font-display,'Poppins',sans-serif)" font-size="80.6" font-weight="600" fill="var(--orange,#ff7517)">hrs</text><text x="1674" y="315" text-anchor="start" dominant-baseline="central" font-family="var(--font-display,'Poppins',sans-serif)" font-size="33.4" font-weight="600" fill="var(--white,#f6f4f4)">Time</text><text x="1674" y="360" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="23.6" font-weight="400" fill="#b4b4b4">Each hour up high draws</text><text x="1674" y="392" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="23.6" font-weight="400" fill="#b4b4b4">down bandwidth, and</text><text x="1674" y="424" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="23.6" font-weight="400" fill="#b4b4b4">repeated days stack the</text><text x="1674" y="456" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="23.6" font-weight="400" fill="#b4b4b4">fatigue.</text><text x="2185" y="240" text-anchor="middle" dominant-baseline="central" font-family="var(--font-display,'Poppins',sans-serif)" font-size="80.6" font-weight="600" fill="var(--orange,#ff7517)">90 min</text><text x="2044" y="315" text-anchor="start" dominant-baseline="central" font-family="var(--font-display,'Poppins',sans-serif)" font-size="33.4" font-weight="600" fill="var(--white,#f6f4f4)">After</text><text x="2044" y="360" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="23.6" font-weight="400" fill="#b4b4b4">Back down low you feel</text><text x="2044" y="392" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="23.6" font-weight="400" fill="#b4b4b4">better, but you are not</text><text x="2044" y="424" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="23.6" font-weight="400" fill="#b4b4b4">back to full for up to 90</text><text x="2044" y="456" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="23.6" font-weight="400" fill="#b4b4b4">minutes.</text><text x="1280" y="630" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="20.8" font-weight="400" fill="#8a8a8a">The check: a note on the cockpit asking what you are thinking.</text><text x="1280" y="660" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="20.8" font-weight="400" fill="#8a8a8a">Mood, thermalling precision and speech change first.</text></svg>
