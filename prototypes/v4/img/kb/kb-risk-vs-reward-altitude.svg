<svg class="dk dk-cq-alt" viewBox="0 0 1200 420" role="img" aria-labelledby="dk-cq-alt-t dk-cq-alt-d" xmlns="http://www.w3.org/2000/svg"><title id="dk-cq-alt-t">Where hypoxia starts to matter</title><desc id="dk-cq-alt-d">The altitude scale where hypoxia starts to matter, from Dr Matt Wilkes: fine low down; most pilots start to be affected at 3,000 to 3,500 m; above that, impaired and not aware of it. General aviation&#x27;s rule: 30 minutes above 3,000 m, or any time above 4,000 m. Beside it, computed from the standard atmosphere, the oxygen in each breath as a share of sea level: about 69% at 3,000 m and 47% at 6,000 m. Three things shrink the margin: cold (shivering multiplies the oxygen burnt by about five), time, and the 90 minutes after coming down. The check: a note on the cockpit asking what you are thinking; mood, thermalling precision and speech change first.</desc><defs><radialGradient id="dk-cq-alt-glow"><stop offset="0" stop-color="#ff7517" stop-opacity=".16"/><stop offset=".45" stop-color="#ff7517" stop-opacity=".05"/><stop offset="1" stop-color="#ff7517" stop-opacity="0"/></radialGradient></defs><circle cx="300" cy="120" r="260" fill="url(#dk-cq-alt-glow)"/><path class="d" d="M100,30 L100,360"/><path class="h" d="M94,360 L106,360"/><text x="88" y="364" class="tb" text-anchor="end">0 m</text><path class="h" d="M94,305 L106,305"/><text x="88" y="309" class="tb" text-anchor="end">1,000 m</text><path class="h" d="M94,250 L106,250"/><text x="88" y="254" class="tb" text-anchor="end">2,000 m</text><path class="h" d="M94,195 L106,195"/><text x="88" y="199" class="tb" text-anchor="end">3,000 m</text><path class="h" d="M94,140 L106,140"/><text x="88" y="144" class="tb" text-anchor="end">4,000 m</text><path class="h" d="M94,85 L106,85"/><text x="88" y="89" class="tb" text-anchor="end">5,000 m</text><path class="h" d="M94,30 L106,30"/><text x="88" y="34" class="tb" text-anchor="end">6,000 m</text><rect class="fa" x="110" y="167.5" width="290" height="27.5" style="fill-opacity:0.22"/><rect class="fa" x="110" y="30" width="290" height="137.5" style="fill-opacity:0.38"/><text x="120" y="185.2" class="tv">most pilots start to be affected</text><text x="120" y="102.8" class="tv">impaired, and not aware of it</text><text x="120" y="281.5" class="sub">fine</text><path class="g" d="M110,217 L400,217"/><path class="a" d="M480,360 L478.6,349 L477.2,338 L475.9,327 L474.5,316 L473.2,305 L471.9,294 L470.7,283 L469.5,272 L468.3,261 L467.1,250 L465.9,239 L464.8,228 L463.7,217 L462.6,206 L461.5,195 L460.5,184 L459.4,173 L458.4,162 L457.5,151 L456.5,140 L455.6,129 L454.6,118 L453.7,107 L452.9,96 L452,85 L451.1,74 L450.3,63 L449.5,52 L448.7,41 L447.9,30"/><circle class="fa" cx="480" cy="360" r="3"/><text x="488" y="364" class="val">100%</text><circle class="fa" cx="461.5" cy="195" r="3"/><text x="469.5" y="199" class="val">69%</text><circle class="fa" cx="447.9" cy="30" r="3"/><text x="455.9" y="34" class="val">47%</text><text x="110" y="209" class="sub">general aviation: 30 min above 3,000 m, or any time above 4,000 m</text><text x="420" y="386" class="tb">oxygen per breath,</text><text x="420" y="400" class="tb">share of sea level (computed)</text><path class="f" d="M624,30 h162 a4,4 0 0 1 4,4 v202 a4,4 0 0 1 -4,4 h-162 a4,4 0 0 1 -4,-4 v-202 a4,4 0 0 1 4,-4 Z"/><path class="d" d="M624,30 h162 a4,4 0 0 1 4,4 v202 a4,4 0 0 1 -4,4 h-162 a4,4 0 0 1 -4,-4 v-202 a4,4 0 0 1 4,-4 Z"/><rect class="fa" x="620" y="30" width="170" height="3"/><text x="636" y="80" class="tt">x5</text><text x="636" y="110" class="lab">Cold</text><text x="636" y="134" class="sub">Shivering multiplies the</text><text x="636" y="149" class="sub">oxygen your body burns by</text><text x="636" y="164" class="sub">about five. Staying warm</text><text x="636" y="179" class="sub">is margin.</text><path class="f" d="M814,30 h162 a4,4 0 0 1 4,4 v202 a4,4 0 0 1 -4,4 h-162 a4,4 0 0 1 -4,-4 v-202 a4,4 0 0 1 4,-4 Z"/><path class="d" d="M814,30 h162 a4,4 0 0 1 4,4 v202 a4,4 0 0 1 -4,4 h-162 a4,4 0 0 1 -4,-4 v-202 a4,4 0 0 1 4,-4 Z"/><rect class="fa" x="810" y="30" width="170" height="3"/><text x="826" y="80" class="tt">hrs</text><text x="826" y="110" class="lab">Time</text><text x="826" y="134" class="sub">Each hour up high draws</text><text x="826" y="149" class="sub">down bandwidth, and</text><text x="826" y="164" class="sub">repeated days stack the</text><text x="826" y="179" class="sub">fatigue.</text><path class="f" d="M1004,30 h162 a4,4 0 0 1 4,4 v202 a4,4 0 0 1 -4,4 h-162 a4,4 0 0 1 -4,-4 v-202 a4,4 0 0 1 4,-4 Z"/><path class="d" d="M1004,30 h162 a4,4 0 0 1 4,4 v202 a4,4 0 0 1 -4,4 h-162 a4,4 0 0 1 -4,-4 v-202 a4,4 0 0 1 4,-4 Z"/><rect class="fa" x="1000" y="30" width="170" height="3"/><text x="1016" y="80" class="tt">90 min</text><text x="1016" y="110" class="lab">After</text><text x="1016" y="134" class="sub">Back down low you feel</text><text x="1016" y="149" class="sub">better, but you are not</text><text x="1016" y="164" class="sub">back to full for up to 90</text><text x="1016" y="179" class="sub">minutes.</text><text x="620" y="290" class="tv">The check: a note on the cockpit asking what you are thinking.</text><text x="620" y="308" class="sub">Mood, thermalling precision and speech change first.</text></svg>
