<svg class="dk dk-ds-brazil" viewBox="0 0 1200 340" role="img" aria-labelledby="dk-ds-brazil-t dk-ds-brazil-d" xmlns="http://www.w3.org/2000/svg"><title id="dk-ds-brazil-t">The championship in Brazil as two pilots tell it</title><desc id="dk-ds-brazil-d">The event moved to Castelo five months before it started. A new goal was set the evening before the task and only checked by the organisers the next morning. Normally, official landings are proven over two or three earlier events. Tilen Ceglar and Stan Radzikowski, Episode 56, chapter 3. Their account. Schematic, not to scale.</desc><defs><radialGradient id="dk-ds-brazil-glow"><stop offset="0" stop-color="#ff7517" stop-opacity=".16"/><stop offset=".45" stop-color="#ff7517" stop-opacity=".05"/><stop offset="1" stop-color="#ff7517" stop-opacity="0"/></radialGradient></defs><circle cx="980" cy="130" r="220" fill="url(#dk-ds-brazil-glow)"/><text x="80" y="44" class="vw">This championship</text><path class="d" d="M80,130 L360,130"/><path class="d" d="M367,139 L377,121"/><path class="d" d="M379,139 L389,121"/><path class="d" d="M396,130 L1100,130"/><path class="fh" d="M1116,130 L1106,133.2 L1106,126.8 Z"/><circle class="fw" cx="160" cy="130" r="4"/><text x="160" y="90" class="lab" text-anchor="middle">The venue moved to Castelo</text><text x="160" y="108" class="sub" text-anchor="middle">five months before it started</text><circle class="fw" cx="800" cy="130" r="4"/><text x="800" y="90" class="lab" text-anchor="middle">A new goal set</text><text x="800" y="108" class="sub" text-anchor="middle">the evening before</text><circle class="fa" cx="980" cy="130" r="5"/><text x="980" y="90" class="lab" text-anchor="middle">Checked by the organisers</text><text x="980" y="108" class="val" text-anchor="middle">the next morning</text><text x="80" y="234" class="vw">Normally</text><path class="h" d="M80,280 L620,280"/><circle class="fw" cx="180" cy="280" r="3.2"/><circle class="fw" cx="300" cy="280" r="3.2"/><circle class="fw" cx="420" cy="280" r="3.2"/><text x="300" y="310" class="sub" text-anchor="middle">two or three earlier events</text><path class="a" d="M440,280 L583.7,280"/><path class="fa" d="M590,280 L581,282.9 L581,277.1 Z"/><text x="604" y="285" class="tv">official landings proven</text><text x="1120" y="320" class="tb" text-anchor="end">Tilen Ceglar &amp; Stan Radzikowski, Ep. 56, ch. 3 · their account · not to scale</text></svg>
