<svg class="dk dk-ds-open" viewBox="0 0 1200 450" role="img" aria-labelledby="dk-ds-open-t dk-ds-open-d" xmlns="http://www.w3.org/2000/svg"><title id="dk-ds-open-t">Two events a week apart, after Bill Belcourt</title><desc id="dk-ds-open-d">At one event the organisers made many of the calls for the field, and there was a serious accident and several close calls. At a hike-and-fly race with weather briefings and no launch-condition rules, pilots chose for themselves, and the only incident was a reserve throw with no injury. Bill Belcourt, Episode 59, chapter 11. Schematic.</desc><defs><radialGradient id="dk-ds-open-glow"><stop offset="0" stop-color="#ff7517" stop-opacity=".16"/><stop offset=".45" stop-color="#ff7517" stop-opacity=".05"/><stop offset="1" stop-color="#ff7517" stop-opacity="0"/></radialGradient></defs><circle cx="1010" cy="240" r="260" fill="url(#dk-ds-open-glow)"/><text x="540" y="64" class="vw">Two events a week apart</text><path class="h" d="M540,84 L840,84"/><text x="540" y="112" class="lab">Organisers made the calls</text><text x="540" y="130" class="sub">many of them, for the field</text><path class="f" d="M600,158 h180 v30 h-180 Z"/><path class="d" d="M600,158 h180 v30 h-180 Z"/><text x="690" y="178" class="sub" text-anchor="middle">organisers</text><path class="h" d="M690,188 L570,216"/><path class="h" d="M690,188 L630,216"/><path class="h" d="M690,188 L690,216"/><path class="h" d="M690,188 L750,216"/><path class="h" d="M690,188 L810,216"/><path class="o" d="M547,244 C548.9,241.3 552.8,230.7 558.5,228 C564.2,225.3 575.8,225.3 581.5,228 C587.2,230.7 591.1,241.3 593,244"/><path class="h" d="M550,245 L570,274"/><path class="h" d="M590,245 L570,274"/><path class="d" d="M566,278 a4,4 0 1,0 8,0 a4,4 0 1,0 -8,0"/><path class="o" d="M607,244 C608.9,241.3 612.8,230.7 618.5,228 C624.2,225.3 635.8,225.3 641.5,228 C647.2,230.7 651.1,241.3 653,244"/><path class="h" d="M610,245 L630,274"/><path class="h" d="M650,245 L630,274"/><path class="d" d="M626,278 a4,4