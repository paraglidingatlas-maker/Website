<svg class="dk dk-cs-speed" viewBox="0 0 1200 400" role="img" aria-labelledby="dk-cs-speed-t dk-cs-speed-d" xmlns="http://www.w3.org/2000/svg"><title id="dk-cs-speed-t">The same wing, faster in thin air</title><desc id="dk-cs-speed-d">Trim speed of the same wing against height. Antoine Girard&#x27;s figures: about 40 km/h at 2,000 m, about 50 in the middle, about 60 at 8,000 m. The line is what thinner air alone gives, from the standard atmosphere: about 47 km/h at 5,000 m and 55 at 8,000 m. His figures run a little above it.</desc><defs><radialGradient id="dk-cs-speed-glow"><stop offset="0" stop-color="#ff7517" stop-opacity=".16"/><stop offset=".45" stop-color="#ff7517" stop-opacity=".05"/><stop offset="1" stop-color="#ff7517" stop-opacity="0"/></radialGradient></defs><circle cx="330" cy="160" r="260" fill="url(#dk-cs-speed-glow)"/><path class="h" d="M110,340 L530,340"/><text x="102" y="344" class="tb" text-anchor="end">0</text><path class="g" d="M110,306.7 L530,306.7"/><path class="h" d="M110,273.3 L530,273.3"/><text x="102" y="277.3" class="tb" text-anchor="end">2,000 m</text><path class="g" d="M110,240 L530,240"/><path class="h" d="M110,206.7 L530,206.7"/><text x="102" y="210.7" class="tb" text-anchor="end">4,000 m</text><path class="g" d="M110,173.3 L530,173.3"/><path class="h" d="M110,140 L530,140"/><text x="102" y="144" class="tb" text-anchor="end">6,000 m</text><path class="g" d="M110,106.7 L530,106.7"/><path class="h" d="M110,73.3 L530,73.3"/><text x="102" y="77.3" class="tb" text-anchor="end">8,000 m</text><path class="g" d="M110,40 L530,40"/><path class="h" d="M110,340 L110,345"/><text x="110" y="360" class="tb" text-anchor="middle">30</text><path class="h" d="M215,340 L215,345"/><text x="215" y="360" class="tb" text-anchor="middle">40</text><path class="h" d="M320,340 L320,345"/><text x="320" y="360" class="tb" text-anchor="middle">50</text><path class="h" d="M425,340 L425,345"/><text x="425" y="360" class="tb" text-anchor="middle">60</text><path class="h" d="M530,340 L530,345"/><text x="530" y="360" class="tb" text-anchor="middle">70</text><text x="530" y="378" class="tb" text-anchor="end">trim speed, km/h</text><path class="d" d="M175.7,340 L178.5,335 L181.2,330 L184.1,325 L186.9,320 L189.8,315 L192.7,310 L195.6,305 L198.6,300 L201.6,295 L204.6,290 L207.7,285 L210.8,280 L213.9,275 L217.1,270 L220.3,265 L223.6,260 L226.9,255 L230.2,250 L233.5,245 L236.9,240 L240.4,235 L243.8,230 L247.3,225 L250.9,220 L254.5,215 L258.1,210 L261.8,205 L265.5,200 L269.3,195 L273.1,190 L276.9,185 L280.8,180 L284.8,175 L288.8,170 L292.8,165 L296.9,160 L301.1,155 L305.2,150 L309.5,145 L313.8,140 L318.1,135 L322.5,130 L327,125 L331.5,120 L336.1,115 L340.7,110 L345.4,105 L350.1,100 L354.9,95 L359.8,90 L364.7,85 L369.7,80 L374.7,75 L379.9,70 L385,65 L390.3,60 L395.6,55 L401,50 L406.5,45 L412,40"/><text x="420" y="44" class="sub">thin air alone</text><circle class="fa" cx="215" cy="273.3" r="5"/><path class="a" d="M286.1,173.3 L320,173.3"/><circle class="fa" cx="320" cy="173.3" r="5"/><path class="a" d="M376.4,73.3 L425,73.3"/><circle class="fa" cx="425" cy="73.3" r="5"/><text x="640" y="78" class="lab">8,000 m</text><text x="640" y="100" class="val">about 60 km/h</text><text x="640" y="120" class="sub">collapses and reactions come faster, and less oxygen slows the pilot</text><path class="h" d="M433,73.3 L620,73.3 L630,74"/><text x="640" y="182" class="lab">about 5,000 m</text><text x="640" y="204" class="val">about 50 km/h</text><text x="640" y="224" class="sub">landing, you touch down at 25 to 30 km/h: hard to run it out</text><path class="h" d="M328,173.3 L620,173.3 L630,178"/><text x="640" y="286" class="lab">2,000 m</text><text x="640" y="308" class="val">about 40 km/h</text><text x="640" y="328" class="sub">the speed you are used to</text><path class="h" d="M223,273.3 L620,273.3 L630,282"/><text x="1180" y="388" class="tb" text-anchor="end">his figures, orange · the line: standard atmosphere, same wing</text></svg>
