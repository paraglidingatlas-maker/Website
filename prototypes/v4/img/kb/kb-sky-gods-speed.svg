<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 620"><polyline points="600,100 600,500" fill="none" stroke="#b4b4b4" stroke-width="0.8" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-opacity="0.5" stroke-linecap="round"/><rect x="600" y="130" width="960" height="40" fill="var(--orange,#ff7517)" fill-opacity="0.9"/><rect x="600" y="280" width="800" height="40" fill="var(--orange-lite,#ff8a3d)" fill-opacity="0.6"/><rect x="600" y="430" width="640" height="40" fill="#b4b4b4" fill-opacity="0.6"/><text x="560" y="150" text-anchor="end" dominant-baseline="central" font-family="var(--font-display,'Poppins',sans-serif)" font-size="27.9" font-weight="600" fill="var(--white,#f6f4f4)">8,000 m</text><text x="1580" y="142" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="25" font-weight="600" fill="var(--white,#f6f4f4)">about 60 km/h</text><text x="1580" y="168" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="20" font-weight="400" fill="#b4b4b4">collapses and reactions come faster, and less oxygen slows the pilot</text><text x="560" y="300" text-anchor="end" dominant-baseline="central" font-family="var(--font-display,'Poppins',sans-serif)" font-size="27.9" font-weight="600" fill="var(--white,#f6f4f4)">about 5,000 m</text><text x="1420" y="292" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="25" font-weight="600" fill="var(--white,#f6f4f4)">about 50 km/h</text><text x="1420" y="318" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="20" font-weight="400" fill="#b4b4b4">landing, you touch down at 25 to 30 km/h: hard to run it out</text><text x="560" y="450" text-anchor="end" dominant-baseline="central" font-family="var(--font-display,'Poppins',sans-serif)" font-size="27.9" font-weight="600" fill="var(--white,#f6f4f4)">2,000 m</text><text x="1260" y="442" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="25" font-weight="600" fill="var(--white,#f6f4f4)">about 40 km/h</text><text x="1260" y="468" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="20" font-weight="400" fill="#b4b4b4">the speed you are used to</text><text x="600" y="560" text-anchor="start" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="20" font-weight="400" fill="#b4b4b4" fill-opacity="0.8">trim speed, same wing</text></svg>
