<svg class="dk dk-cs-mb" viewBox="0 0 1200 330" role="img" aria-labelledby="dk-cs-mb-t dk-cs-mb-d" xmlns="http://www.w3.org/2000/svg"><title id="dk-cs-mb-t">Millibars to metres</title><desc id="dk-cs-mb-d">Millibars to metres, the rule of thumb: start at 1,000 millibars at sea level; every 100 millibars less is about 1,000 metres higher: 900 is about 1,000 m, 800 about 2,000 m and 700 about 3,000 m. Beside each, the standard atmosphere&#x27;s height for that pressure: about 110, 990, 1,950 and 3,010 m. Forecasts give the wind at a pressure, because that is how balloons report it.</desc><defs><radialGradient id="dk-cs-mb-glow"><stop offset="0" stop-color="#ff7517" stop-opacity=".16"/><stop offset=".45" stop-color="#ff7517" stop-opacity=".05"/><stop offset="1" stop-color="#ff7517" stop-opacity="0"/></radialGradient></defs><circle cx="700" cy="160" r="300" fill="url(#dk-cs-mb-glow)"/><path class="h" d="M150,110 L1120,110"/><path class="h" d="M150,200 L1120,200"/><text x="136" y="114" class="tb" text-anchor="end">pressure</text><text x="136" y="204" class="tb" text-anchor="end">height</text><path class="a" d="M170,110 L204.4,200"/><circle class="fa" cx="170" cy="110" r="5"/><circle class="fw" cx="204.4" cy="200" r="4.5"/><text x="170" y="90" class="lab" text-anchor="middle">1000 mb</text><text x="204.4" y="226" class="tv" text-anchor="middle">sea level</text><text x="204.4" y="244" class="sub" text-anchor="middle">standard: 110 m</text><path class="a" d="M480,110 L476.4,200"/><circle class="fa" cx="480" cy="110" r="5"/><circle class="fw" cx="476.4" cy="200" r="4.5"/><text x="480" y="90" class="lab" text-anchor="middle">900 mb</text><text x="476.4" y="226" class="val" text-anchor="middle">about 1,000 m</text><text x="476.4" y="244" class="sub" text-anchor="middle">standard: 990 m</text><path class="a" d="M790,110 L774.2,200"/><circle class="fa" cx="790" cy="110" r="5"/><circle class="fw" cx="774.2" cy="200" r="4.5"/><text x="790" y="90" class="lab" text-anchor="middle">800 mb</text><text x="774.2" y="226" class="val" text-anchor="middle">about 2,000 m</text><text x="774.2" y="244" class="sub" text-anchor="middle">standard: 1,950 m</text><path class="a" d="M1100,110 L1103.8,200"/><circle class="fa" cx="1100" cy="110" r="5"/><circle class="fw" cx="1103.8" cy="200" r="4.5"/><text x="1100" y="90" class="lab" text-anchor="middle">700 mb</text><text x="1103.8" y="226" class="val" text-anchor="middle">about 3,000 m</text><text x="1103.8" y="244" class="sub" text-anchor="middle">standard: 3,010 m</text><text x="635" y="50" class="sub" text-anchor="middle">every 100 millibars less is about 1,000 metres higher</text><rect class="fa" x="480" y="272" width="620" height="6" style="fill-opacity:0.35"/><text x="790" y="298" class="sub" text-anchor="middle">the range most flying forecasts need</text><text x="1180" y="322" class="tb" text-anchor="end">the slant: the standard atmosphere puts each pressure a little off the round number</text></svg>
