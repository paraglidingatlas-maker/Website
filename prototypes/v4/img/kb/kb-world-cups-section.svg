<svg class="dk dk-rs-wcs" viewBox="0 0 1600 667" role="img" aria-labelledby="dk-rs-wcs-t dk-rs-wcs-d" xmlns="http://www.w3.org/2000/svg"><title id="dk-rs-wcs-t">Multi radius turnpoints</title><desc id="dk-rs-wcs-d">Multi radius turnpoints: one turnpoint with three concentric cylinders, the smallest for the heaviest class and the largest for the lightest, and the course line each class flies from the last turnpoint to the next, tagging its own edge where the line bends.</desc><defs><radialGradient id="rs-wcs-g" gradientUnits="userSpaceOnUse" cx="1146.7" cy="333.3" r="220"><stop offset="0" stop-color="#ff7517" stop-opacity="0.12"/><stop offset="0.4" stop-color="#ff7517" stop-opacity="0.041999999999999996"/><stop offset="1" stop-color="#ff7517" stop-opacity="0"/></radialGradient></defs><circle cx="1146.7" cy="333.3" r="220" fill="url(#rs-wcs-g)"/><path class="a" d="M946.7,333.3 a200,200 0 1,0 400,0 a200,200 0 1,0 -400,0"/><path class="a" d="M706.7,546.7 L1146.8,533.3 L1533.3,520"/><circle class="fa" cx="1146.8" cy="533.3" r="3.5"/><path class="d" d="M1006.7,333.3 a140,140 0 1,0 280,0 a140,140 0 1,0 -280,0"/><path class="d" d="M706.7,546.7 L1146.8,473.3 L1533.3,520"/><circle class="fw" cx="1146.8" cy="473.3" r="3.5"/><path class="o" d="M1066.7,333.3 a80,80 0 1,0 160,0 a80,80 0 1,0 -160,0"/><path class="o" d="M706.7,546.7 L1146.7,413.3 L1533.3,520"/><circle class="fw" cx="1146.7" cy="413.3" r="3.5"/><circle class="fw" cx="1146.7" cy="333.3" r="3"/><text x="1360" y="173.3" class="val">lightest pilots: biggest cylinder</text><text x="1306.7" y="233.3" class="sub">middle</text><text x="1240" y="293.3" class="lab">heaviest: smallest</text><text x="706.7" y="569.3" class="sub" text-anchor="middle">from the last turnpoint</text><text x="1533.3" y="542.7" class="sub" text-anchor="middle">to the next</text></svg>
