"110" width="216.7" height="44" style="fill-opacity:0.5"/><path class="a" d="M1080,80 L1080,170"/><text x="266" y="92" class="lab">Wing</text><text x="266" y="76" class="sub">about 1.8 kg, lines unsheathed</text><text x="758" y="92" class="lab">Harness</text><text x="758" y="76" class="sub">300 g</text><text x="840" y="92" class="lab">Reserve</text><text x="840" y="76" class="sub">about 800 g</text><text x="1090" y="100" class="val">under 3 kg</text><text x="1090" y="116" class="sub">the whole setup</text><text x="240" y="128" class="lab" text-anchor="end">Sandrine Roy&#x27;s</text><text x="240" y="144" class="sub" text-anchor="end">flying kit</text><text x="600" y="250" class="sub" text-anchor="middle">all of it, with shoes and a waterproof, fits in one 24-litre bike bag; every piece is more than six years old</text></svg>
