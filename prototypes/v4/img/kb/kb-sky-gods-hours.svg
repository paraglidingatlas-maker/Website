<svg class="dk dk-cp-hours" viewBox="0 0 1200 330" role="img" aria-labelledby="dk-cp-hours-t dk-cp-hours-d" xmlns="http://www.w3.org/2000/svg"><title id="dk-cp-hours-t">Hours in the air a year</title><desc id="dk-cp-hours-d">Hours in the air a year. Honorin Hamard now flies about 500 hours a year; Maxime Pinot has flown between 250 and 450 a year for two decades; pilots building towards the World Cup from scratch fly 400 to 500; and in an X-Alps season Pinot trained about 450 hours in the air and 450 on foot.</desc><defs><radialGradient id="dk-cp-hours-glow"><stop offset="0" stop-color="#ff7517" stop-opacity=".16"/><stop offset=".45" stop-color="#ff7517" stop-opacity=".05"/><stop offset="1" stop-color="#ff7517" stop-opacity="0"/></radialGradient></defs><circle cx="560" cy="160" r="300" fill="url(#dk-cp-hours-glow)"/><path class="h" d="M380,30 L380,270"/><text x="380" y="290" class="tb" text-anchor="middle">0</text><path class="g" d="M457,30 L457,270"/><text x="457" y="290" class="tb" text-anchor="middle">100</text><path class="g" d="M534,30 L534,270"/><text x="534" y="290" class="tb" text-anchor="middle">200</text><path class="g" d="M611,30 L611,270"/><text x="611" y="290" class="tb" text-anchor="middle">300</text><path class="g" d="M688,30 L688,270"/><text x="688" y="290" class="tb" text-anchor="middle">400</text><path class="h" d="M765,30 L765,270"/><text x="765" y="290" class="tb" text-anchor="middle">500</text><path class="g" d="M842,30 L842,270"/><text x="842" y="290" class="tb" text-anchor="middle">600</text><path class="g" d="M919,30 L919,270"/><text x="919" y="290" class="tb" text-anchor="middle">700</text><path class="g" d="M996,30 L996,270"/><text x="996" y="290" class="tb" text-anchor="middle">800</text><path class="g" d="M1073,30 L1073,270"/><text x="1073" y="290" class="tb" text-anchor="middle">900</text><path class="h" d="M1150,30 L1150,270"/><text x="1150" y="290" class="tb" text-anchor="middle">1,000</text><text x="1150" y="312" class="tb" text-anchor="end">hours a year</text><text x="364" y="58" class="lab" text-anchor="end">Honorin Hamard, now</text><text x="364" y="74" class="sub" text-anchor="end">about 500</text><rect class="fa" x="380" y="48" width="385" height="16" style="fill-opacity:0.9"/><text x="364" y="118" class="lab" text-anchor="end">Maxime Pinot, over 20 years</text><text x="364" y="134" class="sub" text-anchor="end">250 to 450</text><rect class="fa" x="380" y="108" width="192.5" height="16" style="fill-opacity:0.9"/><rect class="fa" x="572.5" y="108" width="154" height="16" style="fill-opacity:0.35"/><text x="364" y="178" class="lab" text-anchor="end">Pilots building towards the World Cup</text><text x="364" y="194" class="sub" text-anchor="end">400 to 500</text><rect class="fw" x="380" y="168" width="308" height="16" style="fill-opacity:0.6"/><rect class="fw" x="688" y="168" width="77" height="16" style="fill-opacity:0.25"/><text x="364" y="238" class="lab" text-anchor="end">Pinot in an X-Alps season</text><text x="364" y="254" class="sub" text-anchor="end">450 flying + 450 on foot</text><rect class="fa" x="380" y="228" width="346.5" height="16" style="fill-opacity:0.9"/><rect class="fh" x="726.5" y="228" width="346.5" height="16" style="fill-opacity:0.35"/></svg>
