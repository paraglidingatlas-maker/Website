<svg class="dk dk-cq-chain" viewBox="0 0 1200 300" role="img" aria-labelledby="dk-cq-chain-t dk-cq-chain-d" xmlns="http://www.w3.org/2000/svg"><title id="dk-cq-chain-t">One idea, and the projects it grew</title><desc id="dk-cq-chain-d">One idea, and the projects it grew. Benjamin Jordan&#x27;s 2003 goal as a novice, to fly from Mexico to Canada, was out of reach, so he boiled it down to what was left: skateboarding across Canada, then a powered paraglider across Canada, and finally the free-flying vol-biv from Mexico to Canada, during COVID. Each project taught the skills for the next; the last one was the first idea.</desc><defs><radialGradient id="dk-cq-chain-glow"><stop offset="0" stop-color="#ff7517" stop-opacity=".16"/><stop offset=".45" stop-color="#ff7517" stop-opacity=".05"/><stop offset="1" stop-color="#ff7517" stop-opacity="0"/></radialGradient></defs><circle cx="1020" cy="130" r="240" fill="url(#dk-cq-chain-glow)"/><path class="f" d="M48,60 h234 a8,8 0 0 1 8,8 v94 a8,8 0 0 1 -8,8 h-234 a8,8 0 0 1 -8,-8 v-94 a8,8 0 0 1 8,-8 Z"/><path class="d" d="M48,60 h234 a8,8 0 0 1 8,8 v94 a8,8 0 0 1 -8,8 h-234 a8,8 0 0 1 -8,-8 v-94 a8,8 0 0 1 8,-8 Z"/><text x="56" y="88" class="lab">The idea, 2003</text><text x="56" y="118" class="sub">a novice&#x27;s goal:</text><text x="56" y="140" class="tv">fly Mexico to Canada</text><path class="a" d="M296,115 L318.4,115"/><path class="fa" d="M324,115 L316,117.6 L316,112.4 Z"/><path class="f" d="M338,60 h234 a8,8 0 0 1 8,8 v94 a8,8 0 0 1 -8,8 h-234 a8,8 0 0 1 -8,-8 v-94 a8,8 0 0 1 8,-8 Z"/><path class="a" d="M338,60 h234 a8,8 0 0 1 8,8 v94 a8,8 0 0 1 -8,8 h-234 a8,8 0 0 1 -8,-8 v-94 a8,8 0 0 1 8,-8 Z"/><text x="346" y="88" class="lab">What was left</text><text x="346" y="118" class="sub">he could walk and skateboard:</text><text x="346" y="140" class="tv">skateboard across Canada</text><path class="a" d="M586,115 L608.4,115"/><path class="fa" d="M614,115 L606,117.6 L606,112.4 Z"/><path class="f" d="M628,60 h234 a8,8 0 0 1 8,8 v94 a8,8 0 0 1 -8,8 h-234 a8,8 0 0 1 -8,-8 v-94 a8,8 0 0 1 8,-8 Z"/><path class="a" d="M628,60 h234 a8,8 0 0 1 8,8 v94 a8,8 0 0 1 -8,8 h-234 a8,8 0 0 1 -8,-8 v-94 a8,8 0 0 1 8,-8 Z"/><text x="636" y="88" class="lab">The next step</text><text x="636" y="118" class="sub">motor on his back:</text><text x="636" y="140" class="tv">powered paraglider across Canada</text><path class="a" d="M876,115 L898.4,115"/><path class="fa" d="M904,115 L896,117.6 L896,112.4 Z"/><path class="f" d="M918,60 h234 a8,8 0 0 1 8,8 v94 a8,8 0 0 1 -8,8 h-234 a8,8 0 0 1 -8,-8 v-94 a8,8 0 0 1 8,-8 Z"/><path class="a" d="M918,60 h234 a8,8 0 0 1 8,8 v94 a8,8 0 0 1 -8,8 h-234 a8,8 0 0 1 -8,-8 v-94 a8,8 0 0 1 8,-8 Z"/><text x="926" y="88" class="lab">The original idea</text><text x="926" y="118" class="sub">during COVID, free flight:</text><text x="926" y="140" class="tv">Mexico to Canada, vol-biv</text><path class="g" d="M1035,176 L1035,220 L165,220"/><path class="d" d="M165,220 L165,183.6"/><path class="fh" d="M165,178 L167.6,186 L162.4,186 Z"/><text x="600" y="256" class="sub" text-anchor="middle">each project taught the skills for the next; the last one was the first idea</text></svg>
