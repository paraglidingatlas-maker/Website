oke" stroke-linejoin="round" stroke-opacity="0.9"/><line x1="592" y1="300" x2="628" y2="300" fill="none" stroke="var(--orange,#ff7517)" stroke-width="1.7" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-opacity="0.9"/><polygon points="638,300 621.3,306.9 621.3,293.1" fill="var(--orange,#ff7517)" fill-opacity="0.9"/><line x1="1162" y1="300" x2="1198" y2="300" fill="none" stroke="var(--orange,#ff7517)" stroke-width="1.7" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-opacity="0.9"/><polygon points="1208,300 1191.3,306.9 1191.3,293.1" fill="var(--orange,#ff7517)" fill-opacity="0.9"/><line x1="1732" y1="300" x2="1768" y2="300" fill="none" stroke="var(--orange,#ff7517)" stroke-width="1.7" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-opacity="0.9"/><polygon points="1778,300 1761.3,306.9 1761.3,293.1" fill="var(--orange,#ff7517)" fill-opacity="0.9"/><text x="330" y="250" text-anchor="middle" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="21.7" font-weight="600" fill="var(--white,#f6f4f4)">THE IDEA, 2003</text><text x="330" y="305" text-anchor="middle" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="23.4" font-weight="400" fill="#b4b4b4">a novice&#x27;s goal:</text><text x="330" y="340" text-anchor="middle" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="26.7" font-weight="600" fill="var(--white,#f6f4f4)">fly Mexico to Canada</text><text x="900" y="250" text-anchor="middle" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="21.7" font-weight="600" fill="var(--orange,#ff7517)">WHAT WAS LEFT</text><text x="900" y="305" text-anchor="middle" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="23.4" font-weight="400" fill="#b4b4b4">he could walk and skateboard:</text><text x="900" y="340" text-anchor="middle" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="26.7" font-weight="600" fill="var(--white,#f6f4f4)">skateboard across Canada</text><text x="1470" y="250" text-anchor="middle" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="21.7" font-weight="600" fill="var(--orange,#ff7517)">THE NEXT STEP</text><text x="1470" y="305" text-anchor="middle" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="23.4" font-weight="400" fill="#b4b4b4">motor on his back:</text><text x="1470" y="340" text-anchor="middle" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="26.7" font-weight="600" fill="var(--white,#f6f4f4)">powered paraglider across Canada</text><text x="2040" y="250" text-anchor="middle" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="21.7" font-weight="600" fill="var(--orange,#ff7517)">THE ORIGINAL IDEA</text><text x="2040" y="305" text-anchor="middle" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="23.4" font-weight="400" fill="#b4b4b4">during COVID, free flight:</text><text x="2040" y="340" text-anchor="middle" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="26.7" font-weight="600" fill="var(--white,#f6f4f4)">Mexico to Canada, vol-biv</text><text x="1185" y="505" text-anchor="middle" dominant-baseline="central" font-family="var(--font-body,'DM Sans',sans-serif)" font-size="21.7" font-weight="400" fill="#b4b4b4" fill-opacity="0.8">each project taught the skills for the next; the last one was the first idea</text></svg>
