<svg class="dk dk-cp-step" viewBox="0 0 1200 270" role="img" aria-labelledby="dk-cp-step-t dk-cp-step-d" xmlns="http://www.w3.org/2000/svg"><title id="dk-cp-step-t">Ready to step up</title><desc id="dk-cp-step-d">The speed range of a wing as one bar, from minimum sink through trim to full bar. Subir Sidhu&#x27;s rule: you are ready to move up when you are comfortable across all of it, not just at trim. 38 to 40 km/h at trim, from a low B to a CCC; the class shows on the bar.</desc><defs><radialGradient id="dk-cp-step-glow"><stop offset="0" stop-color="#ff7517" stop-opacity=".16"/><stop offset=".45" stop-color="#ff7517" stop-opacity=".05"/><stop offset="1" stop-color="#ff7517" stop-opacity="0"/></radialGradient></defs><circle cx="820" cy="120" r="300" fill="url(#dk-cp-step-glow)"/><rect class="fh" x="120" y="111" width="172.8" height="18" style="fill-opacity:0.2"/><path class="h" d="M120,104 L120,136"/><rect class="fh" x="292.8" y="111" width="230.4" height="18" style="fill-opacity:0.35"/><path class="h" d="M292.8,104 L292.8,136"/><rect class="fa" x="523.2" y="111" width="556.8" height="18" style="fill-opacity:0.85"/><path class="h" d="M523.2,104 L523.2,136"/><path class="h" d="M1080,104 L1080,136"/><rect class="fh" x="177.6" y="86" width="480" height="6" style="fill-opacity:0.7"/><path class="a" d="M657.6,92 L663.6,86"/><path class="a" d="M666.6,92 L672.6,86"/><path class="a" d="M675.6,92 L681.6,86"/><path class="a" d="M684.6,92 L690.6,86"/><path class="a" d="M693.6,92 L699.6,86"/><path class="a" d="M702.6,92 L708.6,86"/><path class="a" d="M711.6,92 L717.6,86"/><path class="a" d="M720.6,92 L726.6,86"/><path class="a" d="M729.6,92 L735.6,86"/><path class="a" d="M738.6,92 L744.6,86"/><path class="a" d="M747.6,92 L753.6,86"/><path class="a" d="M756.6,92 L762.6,86"/><path class="a" d="M765.6,92 L771.6,86"/><path class="a" d="M774.6,92 L780.6,86"/><path class="a" d="M783.6,92 L789.6,86"/><path class="a" d="M792.6,92 L798.6,86"/><path class="a" d="M801.6,92 L807.6,86"/><p