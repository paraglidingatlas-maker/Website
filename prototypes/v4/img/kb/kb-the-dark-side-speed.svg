<svg class="dk dk-cp-dss" viewBox="0 0 1200 300" role="img" aria-labelledby="dk-cp-dss-t dk-cp-dss-d" xmlns="http://www.w3.org/2000/svg"><title id="dk-cp-dss-t">A slower top class, still at full bar</title><desc id="dk-cp-dss-d">Why a slower top class still means full bar. Speed ranges from trim to full bar as bars. Before 2011: open-class wings with a lot of speed that was rarely all used. Today: CCC wings about 20 km/h slower at the top and used most of the time, while slower wings in the same gaggle sit pinned at their limit. Schematic, no scale.</desc><defs><radialGradient id="dk-cp-dss-glow"><stop offset="0" stop-color="#ff7517" stop-opacity=".16"/><stop offset=".45" stop-color="#ff7517" stop-opacity=".05"/><stop offset="1" stop-color="#ff7517" stop-opacity="0"/></radialGradient></defs><circle cx="860" cy="120" r="300" fill="url(#dk-cp-dss-glow)"/><rect class="fh" x="170" y="104" width="350" height="12" style="fill-opacity:0.18"/><rect class="fa" x="170" y="104" width="215" height="12" style="fill-opacity:0.55"/><rect class="fw" x="518.5" y="99" width="3" height="22"/><text x="158" y="114" class="tv" text-anchor="end">Open class</text><path class="o" d="M385,90 L385,130"/><text x="385" y="78" class="sub" text-anchor="middle">what was usually used</text><text x="170" y="200" class="lab">Before 2011</text><text x="170" y="218" class="sub">lots of speed, rarely all of it</text><rect class="fh" x="720" y="74" width="280" height="12" style="fill-opacity:0.18"/><rect class="fa" x="720" y="74" width="260" height="12" style="fill-opacity:0.55"/><rect class="fw" x="998.5" y="69" width="3" height="22"/><text x="708" y="84" class="tv" text-anchor="end">CCC</text><rect class="fh" x="720" y="110" width="235" height="12" style="fill-opacity:0.18"/><rect class="fa" x="720" y="110" width="235" height="12" style="fill-opacity:0.9"/><rect class="fw" x="953.5" y="105" width="3" height="22"/><text x="708" y="120" class="tv" text-anchor="end">EN D</text><text x="992" y="120" class="val">pinned at full bar</text><rect class="fh" x="720" y="146" width="200" height="12" style="fill-opacity:0.18"/><rect class="fa" x="720" y="146" width="200" height="12" style="fill-opacity:0.9"/><rect class="fw" x="918.5" y="141" width="3" height="22"/><text x="708" y="156" class="tv" text-anchor="end">EN C</text><text x="992" y="156" class="val">pinned at full bar</text><path class="a" d="M980,56 L980,170"/><text x="980" y="46" class="val" text-anchor="middle">pace of the lead gaggle</text><text x="720" y="200" class="lab">Today</text><text x="720" y="218" class="sub">a slower top class, used most of the time</text><text x="1180" y="290" class="tb" text-anchor="end">schematic: bar length is speed range from trim to full bar, not to scale</text></svg>
