<!doctype html><html lang="en-GB"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Atlas Encyclopedia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a visual encyclopedia. Front page of tiles and moving pictures; each article is a stack of
   graphic panels (animation, interactive, icon grid, steps) with text cut to captions. */
:root{--bg:#141519;--panel:#1c1d23;--panel2:#24252c;--ink:#f6f4f4;--soft:#b4b4b4;--dim:#7d7d84;--line:rgba(180,180,180,.14);
  --or:#ff7517;--or2:#ff9a52;--wash:rgba(255,117,23,.12);--green:#7dd87d;--red:#ff5a4a;--sky:#6fb7ff;
  --display:"Poppins",Arial,Helvetica,sans-serif;--body:"DM Sans",Arial,Helvetica,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--soft);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
svg.i{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{font-family:var(--display);color:var(--ink);margin:0;text-wrap:balance}
.k{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--or)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--or);outline-offset:3px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(20,21,25,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:14px;height:58px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:700;letter-spacing:.02em}
.logo b{color:var(--or)}
.bar .sp{flex:1}
.bar button.home{background:none;border:1px solid var(--line);color:var(--soft);padding:6px 12px}
.bar button.home:hover{color:var(--ink);border-color:var(--or)}

/* ---------- front page ---------- */
.front-hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
#sky{position:absolute;inset:0;width:100%;height:100%}
.front-hero .wrap{position:relative;padding-block:clamp(48px,9vw,110px) clamp(40px,6vw,70px)}
.front-hero h1{font-size:clamp(2.3rem,6vw,4.4rem);line-height:1.02;font-weight:800;max-width:12ch}
.front-hero h1 span{color:var(--or)}
.front-hero p{max-width:46ch;color:var(--soft);font-size:1.08rem;margin:1rem 0 1.6rem}
.search{display:flex;align-items:center;gap:10px;max-width:560px;background:rgba(28,29,35,.9);border:1px solid var(--line);padding:4px 6px 4px 14px}
.search input{flex:1;min-width:0;background:none;border:none;color:var(--ink);font:inherit;font-size:1rem;padding:10px 0}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--or)}
.hits{max-width:560px;margin-top:6px;display:grid;gap:4px}
.hits button{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:9px 12px}
.hits button:hover{border-color:var(--or)}
.stats{display:flex;flex-wrap:wrap;gap:22px;margin-top:22px}
.stats div{display:flex;align-items:center;gap:8px;color:var(--soft);font-size:.86rem}
.stats b{font-family:var(--display);color:var(--ink);font-size:1.2rem}
.stats svg{color:var(--or)}

.sec{padding-block:clamp(36px,6vw,64px)}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.sec-h h2{font-size:clamp(1.4rem,2.8vw,2rem)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(170px,100%),1fr));gap:12px}
.cat{position:relative;display:flex;flex-direction:column;gap:12px;align-items:flex-start;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:18px 16px 16px;min-height:150px;transition:transform .2s,border-color .2s}
.cat:hover{transform:translateY(-3px);border-color:var(--or)}
.cat .ic{width:54px;height:54px;display:grid;place-items:center;background:var(--wash);color:var(--or);border-radius:50%}
.cat .ic svg{width:30px;height:30px}
.cat b{font-family:var(--display);font-size:1rem;line-height:1.2}
.cat small{color:var(--dim);font-size:.8rem}
.cat:hover .ic svg{animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px) rotate(-4deg)}}

.feature{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:0;background:var(--panel);border:1px solid var(--line);overflow:hidden;text-align:left;color:inherit;padding:0;width:100%}
.feature .art{position:relative;background:radial-gradient(120% 90% at 50% 100%,rgba(255,117,23,.18),transparent 60%),#17181d;min-height:260px}
.feature .art canvas{position:absolute;inset:0;width:100%;height:100%}
.feature .txt{padding:clamp(20px,3vw,34px);display:flex;flex-direction:column;gap:12px;justify-content:center}
.feature h3{font-size:clamp(1.6rem,3vw,2.3rem)}
.feature p{margin:0;color:var(--soft)}
.go{display:inline-flex;align-items:center;gap:8px;color:var(--or);font-weight:600}
.feature:hover{border-color:var(--or)}

.dyk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;background:linear-gradient(110deg,rgba(255,117,23,.14),rgba(255,117,23,.02) 60%),var(--panel);border:1px solid var(--line);padding:20px 22px}
.dyk .bulb{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--or);color:#171712}
.dyk .bulb svg{width:30px;height:30px;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.12)}}
.dyk p{margin:0;color:var(--ink);font-family:var(--display);font-weight:500;font-size:clamp(1rem,1.8vw,1.2rem);min-height:3.2em;transition:opacity .35s}
.dyk small{display:block;color:var(--dim);font-family:var(--body);font-weight:400;font-size:.8rem;margin-top:4px}
.dyk .nav{display:flex;gap:6px}
.dyk .nav button{width:38px;height:38px;border:1px solid var(--line);background:var(--bg);color:var(--ink);display:grid;place-items:center}
.dyk .nav button:hover{border-color:var(--or)}

.az{display:flex;flex-wrap:wrap;gap:8px}
.az button{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:8px 12px 8px 8px;font-size:.92rem}
.az button .lt{width:28px;height:28px;display:grid;place-items:center;background:var(--panel2);color:var(--or);font-family:var(--display);font-weight:700;font-size:.85rem}
.az button.live{border-color:rgba(255,117,23,.55)}
.az button.live .lt{background:var(--or);color:#171712}
.az button:hover{border-color:var(--or)}
.legend{display:flex;gap:16px;color:var(--dim);font-size:.8rem;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;background:var(--or);margin-right:6px;vertical-align:middle}
.legend i.o{background:var(--panel2);border:1px solid var(--line)}

/* ---------- article ---------- */
.a-hero{position:relative;border-bottom:1px solid var(--line);overflow:hidden;background:radial-gradient(80% 120% at 75% 30%,rgba(111,183,255,.08),transparent 60%)}
.a-hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(16px,4vw,48px);align-items:center;padding-block:clamp(28px,5vw,56px)}
.crumb{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:.82rem;margin-bottom:14px;flex-wrap:wrap}
.crumb button{background:none;border:none;color:var(--soft);padding:0}
.crumb button:hover{color:var(--or)}
.a-hero h1{font-size:clamp(2.6rem,7vw,5rem);line-height:1;font-weight:800}
.a-hero .q{font-family:var(--display);color:var(--or2);font-size:clamp(1rem,1.8vw,1.2rem);margin:.6rem 0 1.1rem}
.lede{font-size:1.1rem;color:var(--ink);max-width:44ch;margin:0 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);padding:7px 12px;font-size:.86rem;color:var(--ink)}
.chip svg{width:20px;height:20px;color:var(--or)}
.stage{position:relative;aspect-ratio:16/11;background:radial-gradient(90% 70% at 50% 110%,rgba(255,117,23,.10),transparent 70%),#16171c;border:1px solid var(--line);max-width:100%}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stage .cap{position:absolute;left:12px;bottom:10px;right:12px;display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--dim)}
.stage .cap b{color:var(--or);font-weight:600}
.stage .replay{position:absolute;top:10px;right:10px;background:rgba(20,21,25,.8);border:1px solid var(--line);color:var(--soft);padding:5px 10px;font-size:.78rem}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:clamp(20px,3vw,40px);align-items:start;padding-block:clamp(28px,5vw,48px)}
.panels{display:grid;gap:clamp(18px,3vw,28px);min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);padding:clamp(18px,3vw,28px);min-width:0}
.panel-h{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.panel-h .num{width:38px;height:38px;flex:none;display:grid;place-items:center;border:1px solid var(--or);color:var(--or);font-family:var(--display);font-weight:700;border-radius:50%}
.panel-h h2{font-size:clamp(1.2rem,2.4vw,1.55rem)}
.panel p.cap2{margin:.2rem 0 0;color:var(--soft);font-size:.95rem;max-width:62ch}

/* angle of attack lab */
.lab{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:center}
.lab svg.foil{width:100%;height:auto;background:#16171c;border:1px solid var(--line)}
.state{display:flex;flex-direction:column;gap:10px}
.state .badge{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:1.5rem;color:var(--ink);transition:color .25s}
.state .badge svg{width:34px;height:34px}
.state p{margin:0;font-size:.95rem}
.meter{position:relative;height:12px;background:linear-gradient(90deg,var(--red) 0 22%,var(--green) 22% 74%,var(--red) 74% 100%);opacity:.85}
.meter i{position:absolute;top:-5px;width:4px;height:22px;background:var(--ink);transition:left .1s}
.meter-l{display:flex;justify-content:space-between;font-size:.72rem;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
input[type=range]{width:100%;accent-color:var(--or);margin-top:14px}
.hint{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:.82rem}
.hint svg{width:18px;height:18px}

/* two kinds */
.kinds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.kind{background:var(--panel2);border:1px solid var(--line);padding:16px;display:grid;gap:10px}
.kind svg.pl{width:100%;height:auto}
.kind h3{font-size:1.1rem}
.kind ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:.9rem}
.kind li{display:flex;gap:8px;align-items:flex-start}
.kind li svg{width:18px;height:18px;color:var(--or);margin-top:2px}

/* trigger grid */
.trig{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tg{background:var(--panel2);border:1px solid var(--line);padding:14px;display:grid;gap:8px;align-content:start;text-align:left;color:var(--ink)}
.tg .ic{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:rgba(255,90,74,.12);color:var(--red)}
.tg .ic svg{width:28px;height:28px}
.tg b{font-family:var(--display);font-size:.95rem}
.tg span{color:var(--soft);font-size:.82rem;line-height:1.45}
.tg .lvl{display:flex;gap:3px}
.tg .lvl i{width:16px;height:5px;background:var(--panel)}
.tg .lvl i.on{background:var(--red)}
.tg:hover .ic svg{animation:shake .5s ease-in-out}
@keyframes shake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}

/* steps */
.steps{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
.steplist{display:grid;gap:6px;counter-reset:s}
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--soft);padding:10px 12px;position:relative;overflow:hidden}
.step .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--soft);transition:.25s}
.step b{display:block;color:var(--ink);font-family:var(--display);font-weight:600;font-size:.95rem}
.step small{font-size:.8rem}
.step.on{border-color:var(--or)}
.step.on .ic{background:var(--or);color:#171712}
.step .pr{position:absolute;left:0;bottom:0;height:2px;background:var(--or);width:0}
.step.on .pr{animation:fill 4s linear forwards}
@keyframes fill{to{width:100%}}
.stepview{position:sticky;top:76px;background:#16171c;border:1px solid var(--line);aspect-ratio:4/3}
.stepview canvas{width:100%;height:100%;display:block}
.stepview .sv-t{position:absolute;left:14px;right:14px;bottom:12px;color:var(--ink);font-family:var(--display);font-weight:600;font-size:.95rem}
.stepview .sv-t small{display:block;color:var(--soft);font-family:var(--body);font-weight:400;font-size:.82rem}
.warn{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:12px 14px;border:1px solid rgba(255,90,74,.5);background:rgba(255,90,74,.08);font-size:.9rem;color:var(--ink)}
.warn svg{width:24px;height:24px;color:var(--red)}

/* guests */
.guests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.guest{background:var(--panel2);border:1px solid var(--line);padding:16px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:start}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#171712;background:var(--or)}
.guest b{color:var(--ink);font-family:var(--display)}
.guest p{margin:.3rem 0 .6rem;font-size:.9rem}
.play{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--or);font-size:.85rem;font-weight:600;border:1px solid rgba(255,117,23,.5);padding:5px 10px 5px 6px}
.play .pb{width:22px;height:22px;border-radius:50%;background:var(--or);display:grid;place-items:center}
.play .pb svg{width:12px;height:12px;fill:#171712;stroke:none}
.wave{display:inline-flex;gap:2px;align-items:center;height:16px}
.wave i{width:2px;background:var(--or);opacity:.7;animation:wv 1.1s ease-in-out infinite}
@keyframes wv{50%{transform:scaleY(.3)}}

/* side box */
.side{position:sticky;top:76px;display:grid;gap:14px}
.box{background:var(--panel);border:1px solid var(--line)}
.box h3{font-size:.95rem;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.box h3 svg{width:20px;height:20px;color:var(--or)}
.box dl{margin:0;padding:6px 16px 12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;font-size:.86rem}
.box dt{color:var(--dim)}
.box dd{margin:0;color:var(--ink)}
.box .see{padding:12px 16px;display:flex;flex-wrap:wrap;gap:6px}
.box .see button{background:var(--bg);border:1px solid var(--line);color:var(--soft);font-size:.8rem;padding:5px 9px}
.box .see button:hover{color:var(--ink);border-color:var(--or)}
.safety{display:flex;gap:12px;padding:14px 16px;font-size:.84rem}
.safety svg{width:26px;height:26px;color:var(--or)}
details.src{background:var(--panel);border:1px solid var(--line);padding:14px 18px}
details.src summary{cursor:pointer;color:var(--ink);font-family:var(--display);font-weight:600;display:flex;align-items:center;gap:10px}
details.src summary svg{color:var(--or)}
details.src ol{margin:12px 0 0;padding-left:20px;font-size:.84rem;display:grid;gap:4px}
details.src a{color:var(--soft)}
.tag{font-size:.7rem;color:var(--dim);border:1px solid var(--line);padding:0 5px;margin-left:6px}

.coming{padding-block:80px;text-align:center}
.coming .ic{width:84px;height:84px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;background:var(--wash);color:var(--or)}
.coming .ic svg{width:44px;height:44px}
.coming p{max-width:46ch;margin:10px auto 20px}
.coming button{background:var(--or);color:#171712;border:none;padding:10px 18px;font-weight:600}
footer{border-top:1px solid var(--line);color:var(--dim);font-size:.82rem;padding-block:22px}

.reveal{opacity:1;transform:none}
.js .reveal{opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s}
.js .reveal.in{opacity:1;transform:none}
@media (max-width:900px){
  .a-hero .wrap,.layout,.lab,.steps,.feature{grid-template-columns:1fr}
  .side,.stepview{position:static}
  .trig{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .kinds,.guests,.trig{grid-template-columns:1fr}
  .dyk{grid-template-columns:1fr}
  .dyk .bulb{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.js .reveal{opacity:1;transform:none}}
</style>

    function show() { el.style.opacity = 0; setTimeout(function () { el.innerHTML = DYK[i][0] + "<small>" + DYK[i][1] + "</small>"; el.style.opacity = 1; }, 200); }
    d.getElementById("dyk-n").onclick = function () { i = (i + 1) % DYK.length; show(); };
    d.getElementById("dyk-p").onclick = function () { i = (i + DYK.length - 1) % DYK.length; show(); };
    show(); if (!reduce) { var tm = setInterval(function () { if (!d.getElementById("dyk")) return clearInterval(tm); i = (i + 1) % DYK.length; show(); }, 7000); }

    // sky: thermals rising, a glider circling in one
    var sky = d.getElementById("sky"), S = ctxOf(sky), parts = [];
    for (var p = 0; p < 70; p++) parts.push({ x: Math.random(), y: Math.random(), s: 0.02 + Math.random() * 0.05, r: 1 + Math.random() * 2 });
    var feat = d.getElementById("feat"), F = ctxOf(feat);
    loop(function (t) {
      var x = S.x; x.clearRect(0, 0, S.w, S.h);
      var g = x.createRadialGradient(S.w * 0.78, S.h * 1.1, 10, S.w * 0.78, S.h * 1.1, S.h * 1.1);
      g.addColorStop(0, "rgba(255,117,23,.16)"); g.addColorStop(1, "rgba(255,117,23,0)"); x.fillStyle = g; x.fillRect(0, 0, S.w, S.h);
      parts.forEach(function (q) {
        var col = Math.abs(q.x - 0.78) < 0.08 ? 1 : 0.35;
        var yy = ((q.y - (reduce ? 0 : t * q.s * col)) % 1 + 1) % 1;
        x.fillStyle = "rgba(255,154,82," + (0.15 + 0.35 * col) + ")";
        x.beginPath(); x.arc(q.x * S.w + Math.sin(t + q.y * 9) * 6, yy * S.h, q.r, 0, 7); x.fill();
      });
      var a = reduce ? 0 : t * 0.6, cx = S.w * 0.78 + Math.cos(a) * 60, cy = S.h * 0.42 - (reduce ? 0 : (t * 4) % 60) + Math.sin(a) * 14;
      glider(x, cx, cy, Math.min(90, S.w * 0.08), 0, Math.cos(a) * 0.35, 0);
      // featured: collapse loop
      var y = F.x, c = (t % 6) / 6, fold = c < 0.2 ? 0 : c < 0.35 ? ease((c - 0.2) / 0.15) : c < 0.65 ? 1 : c < 0.85 ? 1 - ease((c - 0.65) / 0.2) : 0;
      y.clearRect(0, 0, F.w, F.h);
      if (c > 0.12 && c < 0.38) arrowDown(y, F.w * 0.66, F.h * 0.08, F.h * 0.16, Math.sin(Math.PI * (c - 0.12) / 0.26));
      glider(y, F.w * 0.5, F.h * 0.42, Math.min(F.w * 0.62, 340), fold, fold * 0.18 * Math.sin(t * 2), 0);
    });
    observe();
  }

  /* ---------- article ---------- */
  function collapse() {
    view.innerHTML = d.getElementById("t-collapse").innerHTML;
    window.scrollTo(0, 0);
    // hero animation: fly, sinking air, fold, turn, reopen
    var c = d.getElementById("hero-anim"), C = ctxOf(c), cap = d.getElementById("hero-cap"), t0 = 0, last = "";
    d.getElementById("replay").onclick = function () { t0 = performanceNow(); };
    function performanceNow() { return performance.now() / 1000; }
    t0 = performanceNow();
    loop(function () {
      var t = (performanceNow() - t0) % 9, x = C.x, w = C.w, h = C.h, label;
      x.clearRect(0, 0, w, h);
      // air
      x.strokeStyle = "rgba(180,180,180,.12)"; x.lineWidth = 1;
      for (var i = 0; i < 7; i++) { var yy = (i / 7) * h + (t * 12) % (h / 7); x.beginPath(); x.moveTo(0, yy); x.lineTo(w, yy); x.stroke(); }
      var fold = 0, roll = 0, sink = 0;
      if (t < 1.5) { label = "<b>Flying</b> · wing pressurised overhead"; }
      else if (t < 2.6) { sink = (t - 1.5) / 1.1; label = "<b>Sinking air</b> hits one side"; }
      else if (t < 3.4) { fold = ease((t - 2.6) / 0.8); label = "<b>Collapse</b> · one side folds"; }
      else if (t < 5.2) { fold = 1; roll = Math.sin((t - 3.4) / 1.8 * Math.PI) * 0.22; label = "<b>Lean away</b> · a little brake on the open side"; }
      else if (t < 6.6) { fold = 1 - ease((t - 5.2) / 1.4); roll = fold * 0.1; label = "<b>Reopening</b> · let it come back"; }
      else { label = "<b>Flying again</b>"; }
      if (sink > 0 || (fold > 0 && t < 3.4)) for (var k = 0; k < 3; k++) arrowDown(x, w * (0.6 + k * 0.08), h * 0.06 + (sink * 20), h * 0.14, Math.min(1, sink + fold));
      glider(x, w * 0.5, h * 0.4, Math.min(w * 0.6, 380), fold, roll, 0);
      if (fold > 0.5 && t > 3.4 && t < 5.2) { x.fillStyle = GREEN; x.font = "600 13px DM Sans, Arial"; x.fillText("lean ←", w * 0.36, h * 0.84); }
      if (label !== last) { cap.innerHTML = label; last = label; }
    });

    // angle of attack lab
    var foil = d.getElementById("foil"), range = d.getElementById("aoa"), sb = d.getElementById("st-b"), st = d.getElementById("st-t"), sm = d.getElementById("st-m");
    function naca(n) {
      var up = [], lo = [], t = 0.17, m = 0.04, p = 0.32;
      for (var i = 0; i <= n; i++) {
        var xx = (1 - Math.cos(Math.PI * i / n)) / 2, yt = 5 * t * (0.2969 * Math.sqrt(xx) - 0.126 * xx - 0.3516 * xx * xx + 0.2843 * Math.pow(xx, 3) - 0.1036 * Math.pow(xx, 4));
        var yc = xx < p ? m / (p * p) * (2 * p * xx - xx * xx) : m / Math.pow(1 - p, 2) * ((1 - 2 * p) + 2 * p * xx - xx * xx);
        up.push([xx, yc + yt]); lo.push([xx, yc - yt]);
      }
      return [up, lo];
    }
    var base = naca(60);
    function drawFoil(a) {
      var col = a < -2 ? 1 : 0, stall = a > 17 ? Math.min(1, (a - 17) / 5) : 0, deflate = a < -2 ? Math.min(1, (-2 - a) / 6) : 0;
      var C2 = 300, cx = 230, cy = 150, r = -a * Math.PI / 180, s = "";
      function P(pt, lower) {
        var xx = pt[0], yy = pt[1];
        if (deflate && !lower && xx < 0.35) { var w = Math.pow(xx / 0.35, 1.3); var low = base[1][Math.round(xx * 60)] ? 0 : 0; yy = lerp(-0.02, yy, w * (1 - deflate) + w * w * deflate * 0.3 + (1 - deflate) * (1 - w)); }
        var X = (xx - 0.3) * C2, Y = -yy * C2;
        return [cx + X * Math.cos(r) - Y * Math.sin(r), cy + X * Math.sin(r) + Y * Math.cos(r)];
      }
      var U = base[0].map(function (p) { return P(p, false); }), L = base[1].map(function (p) { return P(p, true); });
      var path = "M" + U.map(function (p) { return p[0].toFixed(1) + " " + p[1].toFixed(1); }).join("L") + "L" + L.reverse().map(function (p) { return p[0].toFixed(1) + " " + p[1].toFixed(1); }).join("L") + "Z";
      var flows = "";
      for (var i = 0; i < 6; i++) {
        var y0 = 60 + i * 36, bend = (a / 25) * (i < 3 ? -26 : -14), path2;
        if (stall && i < 3) path2 = "M10 " + y0 + " C 120 " + y0 + ", 170 " + (y0 + bend) + ", 230 " + (y0 + bend - 6) + " q 30 -20 50 0 t 50 0 t 50 0";
        else path2 = "M10 " + y0 + " C 140 " + y0 + ", 200 " + (y0 + bend) + ", 300 " + (y0 + bend * 0.6) + " S 460 " + (y0 + bend * 0.2) + ", 510 " + y0;
        flows += '<path d="' + path2 + '" fill="none" stroke="' + (stall && i < 3 ? RED : "#5b5c63") + '" stroke-width="1.3" stroke-dasharray="' + (stall && i < 3 ? "3 5" : "0") + '"/>';
      }
      var liftLen = a > -2 && a < 17 ? 30 + a * 5 : a >= 17 ? Math.max(10, 115 - (a - 17) * 14) : 6;
      var lift = '<path d="M230 140 V' + (140 - liftLen) + '" stroke="' + OR + '" stroke-width="3"/><path d="M222 ' + (148 - liftLen) + ' L230 ' + (134 - liftLen) + ' L238 ' + (148 - liftLen) + 'Z" fill="' + OR + '"/>';
      var arrows = deflate ? '<path d="M150 20 V75" stroke="' + OR + '" stroke-width="3"/><path d="M142 66 L150 80 L158 66Z" fill="' + OR + '"/><text x="162" y="34" fill="' + OR + '" font-size="13" font-family="DM Sans">sinking air</text>' : "";
      foil.innerHTML = flows + '<path d="' + path + '" fill="' + (deflate ? "rgba(255,90,74,.18)" : stall ? "rgba(255,90,74,.12)" : FILL) + '" stroke="' + WH + '" stroke-width="2"/>' + lift + arrows +
        '<text x="14" y="288" fill="#7d7d84" font-size="12" font-family="DM Sans">angle of attack ' + a.toFixed(1) + '° · air from the left</text>';
      var state = a < -2 ? ["x", "Collapse", "The nose is pushed in and the front folds.", RED] : a > 17 ? ["warn", "Stall", "The air breaks away from the top. The wing stops flying.", RED] : ["check", "Flying", a > 11 ? "Slow, close to the stall. Easy on the brakes." : "Pressurised and making lift.", GREEN];
      sb.innerHTML = icon(state[0]) + "<span>" + state[1] + "</span>"; sb.style.color = state[3]; st.textContent = state[2];
      sm.style.left = ((a + 10) / 36 * 100) + "%";
    }
    range.addEventListener("input", function () { drawFoil(+range.value); });
    drawFoil(+range.value);

    d.getElementById("trig").innerHTML = TRIG.map(function (t) {
      var lv = ""; for (var i = 1; i <= 3; i++) lv += '<i class="' + (i <= t[3] ? "on" : "") + '"></i>';
      return '<div class="tg"><span class="ic">' + icon(t[0]) + '</span><b>' + t[1] + '</b><span>' + t[2] + '</span><span class="lvl" title="How often it comes up in the sources">' + lv + '</span></div>';
    }).join("");

    // steps with their own animation
    var list = d.getElementById("steps"), cur = 0, timer, sv = d.getElementById("sv-t");
    list.innerHTML = STEPS.map(function (s, i) { return '<button type="button" class="step" data-i="' + i + '"><span class="ic">' + icon(s[0]) + '</span><span><b>' + (i + 1) + ". " + s[1] + '</b><small>' + s[2] + '</small></span><span class="pr"></span></button>'; }).join("");
    function setStep(i) {
      cur = i; [].forEach.call(list.children, function (b, j) { b.classList.toggle("on", j === i); var p = b.querySelector(".pr"); p.style.animation = "none"; p.offsetWidth; p.style.animation = ""; });
      sv.innerHTML = (i + 1) + ". " + STEPS[i][1] + "<small>" + STEPS[i][2] + "</small>";
      clearTimeout(timer); if (!reduce) timer = setTimeout(function () { if (d.getElementById("steps")) setStep((cur + 1) % STEPS.length); }, 4000);
    }
    list.addEventListener("click", function (e) { var b = e.target.closest(".step"); if (b) setStep(+b.dataset.i); });
    setStep(0);
    var sc = d.getElementById("step-anim"), SC = ctxOf(sc);
    loop(function (t) {
      var x = SC.x, w = SC.w, h = SC.h, ph = (t % 4) / 4; x.clearRect(0, 0, w, h);
      var fold = [1, 1, 1, 1 - ease(ph), 0.5][cur], roll = [0, 0.15, 0.1, 0.05, 0][cur], W = Math.min(w * 0.55, 240), cx = w / 2, cy = h * 0.28;
      if (cur === 4) fold = 0.5 + 0.12 * Math.sin(t * 6);
      glider(x, cx, cy, W, fold, roll * Math.sin(t * 2), 0);
      var py = cy + W / 2 * 0.95 + 14;
      x.lineWidth = 2.5; x.strokeStyle = OR; x.fillStyle = OR;
      if (cur === 0) { var off = ease(Math.min(1, ph * 1.6)); x.strokeStyle = WH; x.beginPath(); x.moveTo(cx - 30, py + 30 - off * 18); x.lineTo(cx + 30, py + 30 - off * 18); x.stroke(); x.fillStyle = GREEN; x.font = "600 13px DM Sans,Arial"; x.fillText("bar released", cx + 38, py + 30 - off * 18); }
      if (cur === 1) { x.beginPath(); x.moveTo(cx, py); x.lineTo(cx - 50 - 10 * Math.sin(t * 3), py); x.stroke(); x.beginPath(); x.moveTo(cx - 60, py - 7); x.lineTo(cx - 72, py); x.lineTo(cx - 60, py + 7); x.fill(); }
      if (cur === 2) { var bx = cx - W * 0.32; x.beginPath(); x.moveTo(bx, py - 40); x.lineTo(bx, py - 40 + 14 + 6 * Math.sin(t * 4)); x.stroke(); x.font = "600 13px DM Sans,Arial"; x.fillText("a little", bx - 22, py - 50); }
      if (cur === 3) { x.fillStyle = GREEN; x.font = "600 13px DM Sans,Arial"; x.fillText(fold < 0.1 ? "open" : "reopening…", cx + W * 0.2, cy - 10); }
      if (cur === 4) { var bx2 = cx + W * 0.32, pull = Math.abs(Math.sin(t * 3)) * 30; x.beginPath(); x.moveTo(bx2, py - 40); x.lineTo(bx2, py - 40 + pull); x.stroke(); x.font = "600 13px DM Sans,Arial"; x.fillText("pump", bx2 + 8, py - 30); }
    });

    d.getElementById("guests").innerHTML = GUESTS.map(function (g) {
      var bars = ""; for (var i = 0; i < 5; i++) bars += '<i style="height:' + (6 + (i * 37 % 10)) + 'px;animation-delay:' + (i * 0.12) + 's"></i>';
      return '<div class="guest"><span class="av">' + g[0] + '</span><div><b>' + g[1] + '</b> <small style="color:var(--dim)">' + g[2] + '</small><p>' + g[3] + '</p><a class="play" href="https://paraglidingatlas.com/episodes/' + g[4] + '.html#' + g[5] + '" target="_blank" rel="noopener"><span class="pb"><svg viewBox="0 0 32 32"><use href="#i-play"/></svg></span>Hear the chapter <span class="wave">' + bars + '</span></a></div></div>';
    }).join("");
    d.getElementById("srcs").innerHTML = SRCS.map(function (s) { return '<li><a href="' + s[2] + '" target="_blank" rel="noopener">' + s[0] + '</a><span class="tag">' + s[1] + '</span></li>'; }).join("");
    observe();
  }

  function soon(name) {
    view.innerHTML = d.getElementById("t-soon").innerHTML;
    d.getElementById("soon-t").textContent = name; window.scrollTo(0, 0);
  }

  function observe() {
    var els = d.querySelectorAll(".reveal");
    if (!("IntersectionObserver" in window)) { [].forEach.call(els, function (e) { e.classList.add("in"); }); return; }
    var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }); }, { threshold: 0.08 });
    [].forEach.call(els, function (e) { io.observe(e); });
    setTimeout(function () { [].forEach.call(els, function (e) { e.classList.add("in"); }); }, 1500);
  }

  function go(where) {
    stopAll();
    if (where === "collapse") { history.replaceState(null, "", "#collapse"); collapse(); }
    else if (where && where.indexOf("soon:") === 0) soon(where.slice(5));
    else { history.replaceState(null, "", "#home"); home(); }
  }
  d.addEventListener("click", function (e) { var b = e.target.closest("[data-go]"); if (b) { e.preventDefault(); go(b.dataset.go); } });
  var resizeT; window.addEventListener("resize", function () { clearTimeout(resizeT); resizeT = setTimeout(function () { go(location.hash === "#collapse" ? "collapse" : "home"); }, 250); });
  go(location.hash === "#collapse" ? "collapse" : "home");
})();
</script>
